# Gitea Actions workflow — Argus design review (static scanner).
#
# Hand-maintained, NOT generated and NOT a copy of .github/workflows/review.yml:
# the GitHub version runs the LLM review via the argus-flash GitHub App, while
# this one runs the platform-independent static scanner (tools/argus_review_gitea.py)
# and posts through the Gitea REST API. The two share no code.
#
# See docs/gitea-platform-guide.md §2 for the two-platform workflow isolation rule.
name: Argus Design Review (Gitea)

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  argus-review:
    name: Design Code Review (static)
    # Dependabot PRs get a read-only token; posting a comment always fails.
    if: gitea.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ gitea.event.pull_request.number }}/head

      - name: Checkout Argus
        uses: actions/checkout@v4
        with:
          repository: cgartlab/argus
          ref: main
          path: .argus-source

      - name: Run Argus static review
        env:
          # Gitea rejects secret names starting with GITEA_ or GITHUB_, so the
          # API token is stored under ARGUS_GITEA_TOKEN.
          GITEA_TOKEN: ${{ secrets.ARGUS_GITEA_TOKEN }}
          # The job runs inside a container on its own bridge network, where
          # the NAS LAN address 192.168.31.92 is NOT reachable. The docker0
          # gateway 172.17.0.1 is the host, and Gitea listens on *:8418.
          GITEA_URL: http://172.17.0.1:8418
        run: |
          set -uo pipefail
          python3 --version

          # actions/checkout writes PR heads to refs/remotes/pull/N/head
          # (its refspec is +refs/pull/N/head:refs/remotes/pull/N/head).
          #
          # IMPORTANT: the "Checkout Argus" step below uses path: .argus-source,
          # which makes actions/checkout initialise a SEPARATE git repository
          # there. So refs/remotes/origin/<base> exists only in
          # .argus-source, never in this working directory. Fetch the base
          # branch here explicitly instead of assuming a previous step left
          # it behind.
          BASE_REF="${{ gitea.event.pull_request.base.ref }}"
          PR_NUM="${{ gitea.event.pull_request.number }}"
          PR_HEAD="refs/remotes/pull/$PR_NUM/head"

          # The base branch is not present in this repository: the Checkout
          # step fetched only the PR refspec, and Checkout Argus created its
          # own separate repository under .argus-source. Fetch it here.
          git fetch --no-tags --depth=1 origin \
            "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" \
            || { echo "[argus] ERROR: could not fetch base branch $BASE_REF" >&2; exit 1; }

          for ref in "$PR_HEAD" "refs/remotes/origin/$BASE_REF"; do
            if ! git rev-parse --verify --quiet "$ref" >/dev/null; then
              echo "[argus] ERROR: $ref not found; cannot determine changed files." >&2
              echo "[argus] refs present:" >&2
              git for-each-ref --format='  %(refname) %(objectname:short)' >&2
              exit 1
            fi
          done

          CHANGED=$(git diff --name-only "refs/remotes/origin/$BASE_REF" "$PR_HEAD" |
            grep -E '\.(css|scss|less|html|vue|svelte)$' || true)

          if [ -z "$CHANGED" ]; then
            echo "[argus] no frontend files changed in this PR; nothing to review."
            exit 0
          fi

          echo "[argus] reviewing changed files:"
          echo "$CHANGED" | sed 's/^/  /'

          rm -rf .argus-review && mkdir -p .argus-review
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if [ -f "$f" ]; then
              mkdir -p ".argus-review/$(dirname "$f")"
              cp "$f" ".argus-review/$f"
            fi
          done <<< "$CHANGED"

          python3 .argus-source/tools/argus_review.py \
            --mode static \
            --json .argus-findings.json \
            .argus-review || echo "[argus] scanner exited non-zero (may be LLM-only extensions in the diff)"

          if [ ! -f .argus-findings.json ]; then
            echo "[argus] no findings file produced; posting an empty summary"
            printf '{"total_issues": 0, "by_severity": {"P0": 0, "P1": 0, "P2": 0, "P3": 0}, "files_reviewed": 0, "stack": "auto", "findings": []}' > .argus-findings.json
          fi

          python3 .argus-source/tools/argus_review_gitea.py \
            --repo-owner "${{ gitea.repository_owner }}" \
            --repo-name "${{ gitea.event.repository.name }}" \
            --pr "${{ gitea.event.pull_request.number }}" \
            --findings .argus-findings.json