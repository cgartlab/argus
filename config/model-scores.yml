# Model score metadata — single source of truth for fallback queue ranking.
# Consumed by tools/update_free_models.py. Auto-refreshed model IDs that are
# not listed here get score 0 and are placed at the bottom of the queue.
#
# Fields:
#   score        — 0-100 raw benchmark score
#   benchmark    — swebench_verified | swebench_verifiable | swebench_pro | intelligence_index | none
#   source       — benchmark data URL
#   confidence   — high | medium | low
#   regions      — (optional) list of region codes where the model is available
#   deprecated   — (optional) true when the model is deprecated; skipped entirely
#   capabilities — (optional) list of capabilities (e.g. code_review)
#
# ── 两种失效标记的区别（都让生成器跳过该模型）────────────────────────────
#   deprecated: true  → 模型**已不该被选用**：已从 Zen 目录消失、已改名，或仍在
#                       目录里但 CLI 无法解析且没有恢复预期。条目保留仅为记录
#                       score 数据，不再被引用。
#   regions: []       → 模型**仍在目录里，但本账号调用必失败**：地区封锁，或
#                       API 列出而 CLI 无法解析。目录看得见 ≠ 能调用。
#   每个条目的注释写明**判定依据与日期**，避免下一个人重新实测一遍。
