#   benchmark    — swebench_verified | swebench_verifiable | swebench_pro | intelligence_index | none
#   source       — benchmark data URL
#   confidence   — high | medium | low
#   regions      — (optional) list of region codes where the model is available
#   deprecated   — (optional) true when the model is deprecated; skipped entirely
#   capabilities — (optional) list of capabilities (e.g. code_review)
