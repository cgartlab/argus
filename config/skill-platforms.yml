# Platform-specific skill display metadata (non-required fields only).
#
# The core `SKILL.md` frontmatter carries the portable standard fields plus the
# two fields the SkillHub CLI requires (`slug`, `displayName` — it reads them
# directly from SKILL.md and errors with "SKILL.md 缺少 slug" without them).
# Everything else registry-specific lives here, so adding a new registry does not
# mean editing the core skill file (issue #153).
#
# Consumed by tools/publish_skillhub.py and tools/publish_clawhub.py.

platforms:
  skillhub:
    # Shown on the registry listing; not required by the CLI.
    summary: "Frontend design code review agent for tokens, hardcoded values, dark mode, accessibility, and copy-ready fixes."
    homepage: https://github.com/cgartlab/argus

  clawhub:
    # ClawHub routes by the portable `name` field from SKILL.md (@owner/name),
    # so no slug override is needed. `emoji` is a ClawHub listing nicety.
    emoji: "eye"
