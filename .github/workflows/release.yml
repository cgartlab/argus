name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Validate versioning
        run: |
          python3 tools/validate_versioning.py

      - name: Create packages
        run: |
          make package-skill
          make package

      - name: Extract release notes for current version
        id: release-notes
        run: |
          VERSION=$(cat VERSION)
          awk -v ver="[${VERSION}]" '
            index($0, "## " ver) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          echo "notes_path=/tmp/release-notes.md" >> $GITHUB_OUTPUT
          echo "Extracted release notes for v${VERSION}:"
          cat /tmp/release-notes.md

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ steps.release-notes.outputs.notes_path }}
          draft: false
          make_latest: true
          files: |
            dist/argus-skill-v*.zip
            dist/argus-v*.tar.gz
            dist/argus-v*.zip
