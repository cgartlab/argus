name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Validate tag name matches VERSION
        run: |
          VER=$(cat VERSION)
          if [ "v${VER}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION ${VER} — refusing to release"
            exit 1
          fi
          echo "ok: tag ${GITHUB_REF_NAME} matches VERSION ${VER}"

      - name: Validate versioning
        run: |
          python3 tools/validate_versioning.py

      - name: Create packages
        run: |
          make package-skill
          make package

      - name: Extract release notes for current version
        id: release-notes
        run: |
          VERSION=$(cat VERSION)
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section '## [${VERSION}]' — release notes would be empty. Aborting release."
            exit 1
          fi
          awk -v ver="[${VERSION}]" '
            index($0, "## " ver) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::Extracted release notes for v${VERSION} are empty. Aborting release."
            exit 1
          fi
          echo "notes_path=/tmp/release-notes.md" >> $GITHUB_OUTPUT
          echo "Extracted release notes for v${VERSION}:"
          cat /tmp/release-notes.md

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ steps.release-notes.outputs.notes_path }}
          draft: false
          make_latest: true
          files: |
            dist/argus-skill-v*.zip
            dist/argus-v*.tar.gz
            dist/argus-v*.zip

  skillhub:
    name: Publish to SkillHub
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install SkillHub CLI
        # Download the installer to a temp file before executing (CWE-494: no
        # integrity check on pipe-to-bash). skillhub.cn does not publish a
        # checksum URL, so full verification is not yet possible — this at
        # least breaks the pipe-to-bash pattern so the script is inspectable.
        run: |
          curl -fsSL https://skillhub.cn/install/install.sh -o /tmp/skillhub-install.sh
          test -s /tmp/skillhub-install.sh
          bash /tmp/skillhub-install.sh --cli-only
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          skillhub --version

      - name: Build skill package
        run: make package-skill

      - name: Prepare SkillHub publish directory
        id: prepare
        run: |
          VERSION=$(cat VERSION)
          python3 tools/publish_skillhub.py prepare \
            dist/argus-skill-v${VERSION}.zip \
            --out dist/skillhub-argus \
            --changelog-out dist/skillhub-changelog.txt
          echo "skill_path=dist/skillhub-argus" >> "$GITHUB_OUTPUT"
          echo "changelog_path=dist/skillhub-changelog.txt" >> "$GITHUB_OUTPUT"

      - name: Login to SkillHub
        env:
          SKILLHUB_KEY: ${{ secrets.SKILLHUB_API_KEY }}
        run: |
          if [ -z "$SKILLHUB_KEY" ]; then
            echo "::error::SKILLHUB_API_KEY secret is required"
            exit 1
          fi
          skillhub login --key "$SKILLHUB_KEY" --host "https://api.skillhub.cn"

      - name: Validate SkillHub publish payload
        run: |
          skillhub publish dist/skillhub-argus --host "https://api.skillhub.cn" --dry-run

      - name: Publish Skill to SkillHub
        run: |
          skillhub publish dist/skillhub-argus --host "https://api.skillhub.cn" --changelog "$(cat dist/skillhub-changelog.txt)"

  clawhub:
    name: Publish to ClawHub
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve ClawHub owner
        id: owner
        env:
          CLAWHUB_OWNER: ${{ vars.CLAWHUB_OWNER }}
        run: |
          if [ -z "$CLAWHUB_OWNER" ]; then
            echo "::notice::vars.CLAWHUB_OWNER is not set — skipping ClawHub publish (set the repo variable + CLAWHUB_TOKEN secret to enable)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "owner=$CLAWHUB_OWNER" >> "$GITHUB_OUTPUT"
          fi

      - name: Build skill package
        if: ${{ steps.owner.outputs.skip != 'true' }}
        run: make package-skill

      - name: Prepare ClawHub publish directory
        if: ${{ steps.owner.outputs.skip != 'true' }}
        run: |
          VERSION=$(cat VERSION)
          python3 tools/publish_clawhub.py prepare \
            dist/argus-skill-v${VERSION}.zip \
            --out dist/clawhub-argus

      - name: Install ClawHub CLI
        if: ${{ steps.owner.outputs.skip != 'true' }}
        run: |
          # Pin via @latest (>= 0.7.1): v0.7.0 omitted acceptLicenseTerms and failed publish.
          npm install -g clawhub@latest
          clawhub --version

      - name: Login to ClawHub
        if: ${{ steps.owner.outputs.skip != 'true' }}
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          if [ -z "$CLAWHUB_TOKEN" ]; then
            echo "::error::CLAWHUB_TOKEN secret not set but vars.CLAWHUB_OWNER is — add the CLAWHUB_TOKEN secret (a clh_... API token) to enable ClawHub publishing"
            exit 1
          fi
          clawhub login --token "$CLAWHUB_TOKEN"
          clawhub whoami

      - name: Publish Skill to ClawHub
        if: ${{ steps.owner.outputs.skip != 'true' }}
        run: |
          VERSION=$(cat VERSION)
          clawhub skill publish dist/clawhub-argus \
            --slug argus-design-review \
            --name "Argus Design Review" \
            --owner "${{ steps.owner.outputs.owner }}" \
            --version "$VERSION"
