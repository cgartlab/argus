name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Validate versioning
        run: |
          python3 tools/validate_versioning.py

      - name: Create packages
        run: |
          make package-skill
          make package

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: CHANGELOG.md
          draft: false
          make_latest: true
          files: |
            dist/argus-skill-v*.zip
            dist/argus-v*.tar.gz
            dist/argus-v*.zip