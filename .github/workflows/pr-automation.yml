name: PR Automation

# Auto-labels, assigns, and adds PRs to the PC Automatic project board.
# Runs when a PR is opened or reopened.

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  automate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Auto-label by branch name
        # SECURITY: never interpolate ${{ github.head_ref }} (attacker-controlled
        # PR branch name) directly into `run:` — GitHub expands expressions
        # before bash parses, so shell metacharacters in the branch name would
        # execute as code. Values passed via `env:` arrive as inert strings.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BRANCH="$HEAD_REF"
          LABEL=""
          case "$BRANCH" in
            feat/*|feature/*)    LABEL="enhancement"      ;;
            fix/*|bugfix/*)      LABEL="bug"              ;;
            docs/*)              LABEL="documentation"    ;;
            chore/*|perf/*)      LABEL="enhancement"      ;;
            refactor/*|style/*)  LABEL="enhancement"      ;;
          esac
          if [ -n "$LABEL" ]; then
            echo "[pr-automation] Adding label: $LABEL"
            gh pr edit "$PR_NUMBER" --add-label "$LABEL" || true
          fi

      - name: Auto-assign PR author
        # Skip Dependabot PRs: App installation tokens cannot assign bot accounts.
        if: github.actor != 'dependabot[bot]' && github.actor != 'argus-flash[bot]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTOR: ${{ github.actor }}
        run: |
          gh pr edit "$PR_NUMBER" --add-assignee "$ACTOR"

      - name: Add to PC Automatic project
        uses: actions/add-to-project@v2
        continue-on-error: true
        with:
          project-url: https://github.com/users/cgartlab/projects/2
          github-token: ${{ secrets.PROJECT_TOKEN }}
