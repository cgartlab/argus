name: Update Free Models

# Refreshes config/free-models.yml from the live opencode model list weekly,
# opening a reviewable pull request instead of pushing to main directly.

on:
  schedule:
    - cron: "23 3 * * 1"        # weekly (Monday 03:23 UTC)
  workflow_dispatch: {}          # manual trigger

permissions:
  contents: write
  pull-requests: write
  issues: write                  # required for the failure-notification step (gh issue create)

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Refresh free model list
        run: |
          # exit codes: 0=unchanged, 1=config updated, 2=error
          # accept exit 1 as success (the PR step below sees the change)
          python3 tools/update_free_models.py --dry-run || [ $? -eq 1 ]
          python3 tools/update_free_models.py || [ $? -eq 1 ]
          python3 tools/update_free_models.py --rank
        shell: bash

      - name: Validate refreshed list before PR
        run: |
          python3 tools/update_free_models.py --check
        shell: bash

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: models-auto/refresh
          delete-branch: true
          commit-message: "chore(models): refresh free model list from opencode [skip changelog]"
          title: "chore(models): refresh free model list from opencode"
          labels: models-auto
          add-paths: config/free-models.yml
          body: |
            Auto-generated by [update-free-models workflow](https://github.com/cgartlab/argus/blob/main/.github/workflows/update-free-models.yml).

            - Refreshes `config/free-models.yml` from the live OpenCode Zen model API
            - Requires human review before merge (bad/deprecated model protection)
            - Related issues: #48 #50 #60 #62
            - Commit includes `[skip changelog]` — do not include in CHANGELOG

      - name: Open failure issue
        if: failure()
        run: |
          gh issue create \
            --title "[Auto] model refresh workflow failed ($(date -u +%Y-%m-%d))" \
            --body "The scheduled free model list refresh failed. See [run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})." \
            --label "automation"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}