name: Update Free Models

# Refreshes config/free-models.yml from the live opencode model list every
# 12 hours so the Argus review action always falls back to currently
# available free models — no manual fixes when models are added/delisted.

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch: {}       # manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenCode CLI
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Refresh free model list
        run: |
          # update_free_models.py exit codes:
          #   0 = unchanged, 1 = config updated (success), 2 = real error
          # GitHub Actions treats any non-zero exit as a step failure, so we
          # must accept exit 1 here — otherwise the commit step below would
          # never run exactly when the list changes.
          python3 tools/update_free_models.py || [ $? -eq 1 ]
        shell: bash

      - name: Validate refreshed list before committing
        run: |
          python3 tools/update_free_models.py --check
        shell: bash

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- config/free-models.yml; then
            echo "Free model list unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/free-models.yml
          git commit -m "chore(models): refresh free model list from opencode"
          # Rebase onto the latest main before pushing to avoid non-fast-forward
          # failures when main moved since checkout (12h cadence).
          git pull --rebase origin main
          git push origin main
          echo "Pushed updated free model list."
        shell: bash
