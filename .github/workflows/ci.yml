name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"   # weekly Monday — model/rule health audit

jobs:
  # ── Job 1: YAML lint + required file checks ─────────────────────────────────
  lint:
    name: Lint & Required Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate YAML syntax
        run: |
          python3 -c "
          import yaml, sys, pathlib
          targets = [
            '.github/workflows/ci.yml',
            '.github/workflows/review.yml',
            '.github/workflows/release.yml',
            '.github/workflows/update-free-models.yml',
            '.github/workflows/pr-automation.yml',
            '.github/actions/argus-review/action.yml',
          ]
          errors = []
          for f in targets:
              p = pathlib.Path(f)
              if not p.exists():
                  errors.append(f'{f}: file not found')
                  continue
              try:
                  yaml.safe_load(p.read_text())
                  print(f'{f}: valid YAML')
              except yaml.YAMLError as e:
                  errors.append(f'{f}: YAML error — {e}')
          if errors:
              for e in errors: print(e, file=sys.stderr)
              sys.exit(1)
          "

      - name: Check required files
        run: |
          required=(
            AGENTS.md
            SKILL.md
            README.md
            VERSION
            CHANGELOG.md
            CONTRIBUTING.md
            Makefile
            tools/run_fixture_tests.py
            tools/load_config.py
            tools/update_free_models.py
            tools/bump_version.py
            tools/validate_versioning.py
            config/free-models.yml
            docs/argus-config-schema.md
            .github/actions/argus-review/action.yml
            .github/workflows/update-free-models.yml
            .github/workflows/pr-automation.yml
            tests/fixtures/README.md
          )
          missing=()
          for f in "${required[@]}"; do
            if [ -f "$f" ]; then
              echo "$f ok"
            else
              echo "$f MISSING" >&2
              missing+=("$f")
            fi
          done
          [ ${#missing[@]} -eq 0 ] || exit 1

  # ── Job 2: Validate Python tool syntax ─────────────────────────────────────
  validate-tools:
    name: Validate Python Tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check Python syntax for all tools
        run: |
          python3 -m py_compile tools/run_fixture_tests.py && echo "run_fixture_tests.py: ok"
          python3 -m py_compile tools/load_config.py       && echo "load_config.py: ok"
          python3 -m py_compile tools/update_free_models.py && echo "update_free_models.py: ok"
          python3 -m py_compile tools/bump_version.py      && echo "bump_version.py: ok"
          python3 -m py_compile tools/validate_versioning.py && echo "validate_versioning.py: ok"

      - name: Validate free model list (config/free-models.yml)
        run: |
          python3 tools/update_free_models.py --check
          echo "free model list validation: ok"

      - name: Validate version consistency (VERSION / CHANGELOG / AGENTS.md / SKILL.md / manifest.yaml)
        run: |
          python3 tools/validate_versioning.py

      - name: Validate load_config.py defaults (no .argus.yml)
        run: |
          python3 tools/load_config.py --validate-only
          echo "load_config default validation: ok"

      - name: Validate load_config.py with example config
        run: |
          cat > /tmp/test-argus.yml << 'EOF'
          version: "0.3"
          skills:
            - design-review
          overrides:
            token-prefix: "--ds-"
          fail-on: [P0, P1]
          output:
            max-findings: 30
          EOF
          python3 tools/load_config.py --config /tmp/test-argus.yml --validate-only
          echo "load_config with example .argus.yml: ok"

  # ── Job 3: Fixture regression tests ────────────────────────────────────────
  fixture-tests:
    name: Fixture Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run fixture tests (dry-run — parse & validate .expected files)
        run: |
          python3 tools/run_fixture_tests.py --dry-run
          echo "Fixture .expected files: all parsed successfully"

      - name: Run fixture tests (static heuristic mode)
        run: |
          python3 tools/run_fixture_tests.py
          echo "Fixture static scanner: all findings validated"

      - name: Verify fixture directory structure
        run: |
          python3 - << 'EOF'
          import sys
          from pathlib import Path

          fixtures_dir = Path("tests/fixtures")
          required_categories = ["design-tokens", "accessibility", "hardcoded-values", "css-quality"]
          # Extensions that count as fixture input files
          INPUT_SUFFIXES = {".css", ".html", ".js", ".ts", ".jsx", ".tsx", ".json"}
          errors = []

          for category in required_categories:
              cat_dir = fixtures_dir / category
              if not cat_dir.is_dir():
                  errors.append(f"Missing fixture category: {cat_dir}")
                  continue

              # Input files: regular files with a recognised fixture extension
              input_files = [
                  f for f in cat_dir.iterdir()
                  if f.is_file() and f.suffix in INPUT_SUFFIXES
              ]
              expected_files = list(cat_dir.glob("*.expected"))

              if not input_files:
                  errors.append(f"{category}: no input fixture files found")
              if not expected_files:
                  errors.append(f"{category}: no .expected files found")
              if len(input_files) != len(expected_files):
                  errors.append(
                      f"{category}: {len(input_files)} input file(s) but "
                      f"{len(expected_files)} .expected file(s) — must match"
                  )

              # Each .expected must have a matching fixture with any INPUT_SUFFIX
              for exp in expected_files:
                  bare = exp.name[: -len(".expected")]  # e.g. "missing-aria"
                  matches = [f for f in input_files if f.stem == bare]
                  if not matches:
                      errors.append(
                          f"{exp.name}: .expected file has no matching input fixture "
                          f"(looked for '{bare}.<ext>' in {category}/)"
                      )

              print(f"{category}: {len(input_files)} fixture(s) ok")

          if errors:
              for e in errors:
                  print(f"ERROR: {e}", file=sys.stderr)
              sys.exit(1)
          else:
              print("All fixture categories valid.")
          EOF

      - name: Upload fixture test results (if any)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fixture-results
          path: fixture-results.json
          if-no-files-found: ignore

  # ── Job 4: Model config change tests (paths-gated) ──────────────────────────
  # Runs the full static suite whenever fallback-model config or its updater
  # changes (#55/#53). Uses dorny/paths-filter (git-diff based) — the naive
  # `github.event.pull_request.changed_files` is an integer count, not a path
  # array, so it cannot gate on paths. On `push`/`schedule` it always runs.
  model-config-tests:
    name: Model Config Change Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect model config changes (PR)
        if: github.event_name == 'pull_request'
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            models:
              - 'config/free-models.yml'
              - 'config/model-scores.yml'
              - 'tools/update_free_models.py'
              - '.github/workflows/update-free-models.yml'

      - name: Validate free model list integrity
        if: steps.changes.outputs.models == 'true' || github.event_name != 'pull_request'
        run: |
          python3 tools/update_free_models.py --check

      - name: Run fixture tests (static heuristic mode)
        if: steps.changes.outputs.models == 'true' || github.event_name != 'pull_request'
        run: |
          python3 tools/run_fixture_tests.py

      - name: Verify model-scores.yml parses
        if: steps.changes.outputs.models == 'true' || github.event_name != 'pull_request'
        run: |
          python3 - << 'EOF'
          import sys, pathlib
          sys.path.insert(0, 'tools')
          from update_free_models import _load_model_scores
          scores = _load_model_scores()
          assert len(scores) >= 5, f'expected >=5 scored models, got {len(scores)}'
          print(f'model-scores.yml: {len(scores)} models ok')
          EOF

  # ── Job 5: LLM fixture tests (optional, graceful degrade) ───────────────────
  # Preflights the external `opencode` CLI and skips gracefully when it or the
  # API key is missing — static tests still cover regressions (#51).
  llm-fixture-tests:
    name: LLM Fixture Tests (optional)
    runs-on: ubuntu-latest
    needs: validate-tools
    if: github.event_name == 'push' || github.event_name == 'schedule'
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Preflight check — opencode CLI present?
        id: cli-check
        run: |
          if command -v opencode >/dev/null 2>&1; then
            echo "opencode CLI found"
            echo "opencode-ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "opencode CLI NOT found — LLM fixture job will be skipped (static tests still cover regressions)"
            echo "opencode-ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run fixture tests in LLM mode
        if: steps.cli-check.outputs.opencode-ok == 'true' && env.OPENCODE_API_KEY != ''
        run: |
          python3 tools/run_fixture_tests.py --json llm-fixture-results.json
          echo "LLM fixture tests: ok"

      - name: Upload LLM fixture results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: llm-fixture-results
          path: llm-fixture-results.json
          if-no-files-found: ignore
