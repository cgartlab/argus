name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"   # weekly Monday — model/rule health audit

# Least privilege: checks only read repository contents (no writes needed).
permissions:
  contents: read

jobs:
  # ── Job 1: YAML lint + required file checks ─────────────────────────────────
  lint:
    name: Lint & Required Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate YAML syntax
        run: |
          python3 -c "
          import yaml, sys, pathlib
          targets = [
            '.github/workflows/ci.yml',
            '.github/workflows/review.yml',
            '.github/workflows/release.yml',
            '.github/workflows/update-free-models.yml',
            '.github/workflows/pr-automation.yml',
            '.github/workflows/release-check.yml',
            '.github/actions/argus-review/action.yml',
          ]
          errors = []
          for f in targets:
              p = pathlib.Path(f)
              if not p.exists():
                  errors.append(f'{f}: file not found')
                  continue
              try:
                  yaml.safe_load(p.read_text())
                  print(f'{f}: valid YAML')
              except yaml.YAMLError as e:
                  errors.append(f'{f}: YAML error — {e}')
          if errors:
              for e in errors: print(e, file=sys.stderr)
              sys.exit(1)
          "

      - name: Check required files
        run: |
          required=(
            AGENTS.md
            SKILL.md
            README.md
            VERSION
            CHANGELOG.md
            CONTRIBUTING.md
            Makefile
            tools/run_fixture_tests.py
            tools/load_config.py
            tools/update_free_models.py
            tools/bump_version.py
            tools/validate_versioning.py
            tools/validate_model_scores.py
            tools/check_release.py
            tools/publish_skillhub.py
            tools/publish_clawhub.py
            tools/_skill_publish.py
            tools/argus_review.py
            tools/argus_report.py
            tools/validate_lessons.py
            .gitlab/argus-review.yml
            .gitlab/argus-review.sh
            tools/add_fp_appeal.py
            config/free-models.yml
            config/wcag-mapping.yml
            config/model-scores.yml
            config/lessons.template.md
            tools/validate_argus_schema.py
            tools/argus_rules.py
            tools/argus_webhook.py
            tools/eval_quality.py
            tools/validate_severity_matrix.py
            tools/validate_action.py
            tools/test_quarantine_git.py
            config/argus-config.schema.json
            config/argus.example.yml
            config/argus-rules.schema.json
            config/argus-rules.example.yml
            config/quality-baseline.json
            config/severity-matrix.yml
            docs/argus-config-schema.md
            docs/argus-rules.md
            docs/marketplace-listing.md
            docs/self-hosting.md
            docs/strategic-plan.md
            docs/project-lessons.md
            .github/actions/argus-review/action.yml
            .github/workflows/update-free-models.yml
            .github/workflows/pr-automation.yml
            tests/fixtures/README.md
          )
          missing=()
          for f in "${required[@]}"; do
            if [ -f "$f" ]; then
              echo "$f ok"
            else
              echo "$f MISSING" >&2
              missing+=("$f")
            fi
          done
          [ ${#missing[@]} -eq 0 ] || exit 1

  # ── Job 2: Validate Python tool syntax ─────────────────────────────────────
  validate-tools:
    name: Validate Python Tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax for all tools
        run: |
          python3 -m py_compile tools/run_fixture_tests.py && echo "run_fixture_tests.py: ok"
          python3 -m py_compile tools/load_config.py       && echo "load_config.py: ok"
          python3 -m py_compile tools/update_free_models.py && echo "update_free_models.py: ok"
          python3 -m py_compile tools/bump_version.py      && echo "bump_version.py: ok"
          python3 -m py_compile tools/validate_versioning.py && echo "validate_versioning.py: ok"
          python3 -m py_compile tools/validate_model_scores.py && echo "validate_model_scores.py: ok"
          python3 -m py_compile tools/check_release.py && echo "check_release.py: ok"
          python3 -m py_compile tools/publish_skillhub.py && echo "publish_skillhub.py: ok"
          python3 -m py_compile tools/publish_clawhub.py && echo "publish_clawhub.py: ok"
          python3 -m py_compile tools/_skill_publish.py && echo "_skill_publish.py: ok"
          python3 -m py_compile tools/argus_review.py && echo "argus_review.py: ok"
          python3 -m py_compile tools/argus_report.py && echo "argus_report.py: ok"
          python3 -m py_compile tools/validate_argus_schema.py && echo "validate_argus_schema.py: ok"
          python3 -m py_compile tools/argus_rules.py && echo "argus_rules.py: ok"
          python3 -m py_compile tools/argus_webhook.py && echo "argus_webhook.py: ok"
          python3 -m py_compile tools/eval_quality.py && echo "eval_quality.py: ok"
          python3 -m py_compile tools/validate_action.py && echo "validate_action.py: ok"
          python3 -m py_compile tools/test_quarantine_git.py && echo "test_quarantine_git.py: ok"

      # Self-test for the composite action. review.yml consumes this action via
      # `...@main`, so a PR that only touches action.yml runs the *old* main
      # version and its own changes are never exercised (#174 regression).
      # This closes that gap on every PR, with no runner needed.
      - name: Validate composite action (self-test)
        run: |
          python3 tools/validate_action.py
          echo "argus-review action: shell syntax + invariants ok"
          python3 tests/action/test_skip_contract.py
          echo "argus-review action: missing deps are skipped, not failed"
          bash tests/action/test_timeout_fallback.sh
          echo "argus-review action: timeout reaches the fallback queue"
          python3 -m py_compile tools/validate_severity_matrix.py && echo "validate_severity_matrix.py: ok"
          python3 -m py_compile tools/validate_lessons.py && echo "validate_lessons.py: ok"
          python3 -m py_compile tools/add_fp_appeal.py && echo "add_fp_appeal.py: ok"

      # The V1-compatibility quarantine must never be visible to git: OpenCode
      # 1.x's `github run` commits whatever `git status --porcelain` reports, so
      # a dirty worktree during a review gets pushed onto the consumer's branch
      # (cgartlab/men@a21a4c44). This runs the real step bodies in a throw-away repo.
      - name: "Regression: quarantine is invisible to git (cgartlab/men@a21a4c44)"
        run: |
          python3 tools/test_quarantine_git.py
          echo "quarantine git-visibility: all assertions ok"

      - name: Validate free model list (config/free-models.yml)
        run: |
          python3 tools/update_free_models.py --check
          echo "free model list validation: ok"

      - name: Validate version consistency (VERSION / CHANGELOG / AGENTS.md / SKILL.md / manifest.yaml)
        run: |
          python3 tools/validate_versioning.py
          python3 tests/test_bump_version.py
          echo "bump_version.py: [Unreleased] promotes into a real section"

      - name: Validate load_config.py defaults (no .argus.yml)
        run: |
          python3 tools/load_config.py --validate-only
          echo "load_config default validation: ok"

      - name: Validate load_config.py with example config
        run: |
          cat > /tmp/test-argus.yml << 'EOF'
          version: "0.3"
          skills:
            - design-review
          overrides:
            token-prefix: "--ds-"
          fail-on: [P0, P1]
          output:
            max-findings: 30
          EOF
          python3 tools/load_config.py --config /tmp/test-argus.yml --validate-only
          echo "load_config with example .argus.yml: ok"

      - name: Validate .argus.yml JSON schema + example config
        run: |
          python3 tools/validate_argus_schema.py --check-schema
          python3 tools/validate_argus_schema.py --config config/argus.example.yml
          echo "argus-config.schema.json: valid JSON + example conforms"

      - name: Validate custom-rules schema + example rules
        run: |
          python3 tools/argus_rules.py --validate --rules config/argus-rules.example.yml
          echo "argus-rules.schema.json: example rules conform"

      - name: Report release state (VERSION vs tags on origin)
        run: |
          python3 tools/check_release.py

      - name: Validate severity matrix (config / SKILL.md / load_config)
        run: |
          python3 tools/validate_severity_matrix.py
          echo "Severity matrix: consistent (config <-> SKILL.md <-> load_config)"

      - name: Validate lessons template (config/lessons.template.md)
        run: |
          python3 tools/validate_lessons.py --file config/lessons.template.md
          echo "lessons template: valid"

  # ── Job 3: Fixture regression tests ────────────────────────────────────────
  fixture-tests:
    name: Fixture Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fixture tests (dry-run — parse & validate .expected files)
        run: |
          python3 tools/run_fixture_tests.py --dry-run
          echo "Fixture .expected files: all parsed successfully"

      - name: Run fixture tests (static heuristic mode)
        run: |
          python3 tools/run_fixture_tests.py
          echo "Fixture static scanner: all findings validated"

      - name: Run quality engine gates
        run: |
          python3 tools/eval_quality.py --gate --json quality-report.json
          echo "Quality gates: passed (precision/recall/F1 vs baseline)"

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-report
          path: quality-report.json
          if-no-files-found: ignore

      - name: Verify fixture directory structure
        run: |
          python3 - << 'EOF'
          import sys
          from pathlib import Path

          fixtures_dir = Path("tests/fixtures")
          required_categories = ["design-tokens", "accessibility", "hardcoded-values", "css-quality",
                                  "false-positives", "should-flag", "golden"]
          # Extensions that count as fixture input files
          INPUT_SUFFIXES = {".css", ".html", ".js", ".ts", ".jsx", ".tsx", ".json"}
          errors = []

          for category in required_categories:
              cat_dir = fixtures_dir / category
              if not cat_dir.is_dir():
                  errors.append(f"Missing fixture category: {cat_dir}")
                  continue

              # Input files: regular files with a recognised fixture extension
              input_files = [
                  f for f in cat_dir.iterdir()
                  if f.is_file() and f.suffix in INPUT_SUFFIXES
              ]
              expected_files = list(cat_dir.glob("*.expected"))

              if not input_files:
                  errors.append(f"{category}: no input fixture files found")
              if not expected_files:
                  errors.append(f"{category}: no .expected files found")
              if len(input_files) != len(expected_files):
                  errors.append(
                      f"{category}: {len(input_files)} input file(s) but "
                      f"{len(expected_files)} .expected file(s) — must match"
                  )

              # Each .expected must have a matching fixture with any INPUT_SUFFIX
              for exp in expected_files:
                  bare = exp.name[: -len(".expected")]  # e.g. "missing-aria"
                  matches = [f for f in input_files if f.stem == bare]
                  if not matches:
                      errors.append(
                          f"{exp.name}: .expected file has no matching input fixture "
                          f"(looked for '{bare}.<ext>' in {category}/)"
                      )

              print(f"{category}: {len(input_files)} fixture(s) ok")

          if errors:
              for e in errors:
                  print(f"ERROR: {e}", file=sys.stderr)
              sys.exit(1)
          else:
              print("All fixture categories valid.")
          EOF

      - name: Verify extension coverage (every reviewable extension is classified)
        run: |
          python3 - << 'EOF'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import argus_review as ar
          import run_fixture_tests as rft

          errors = []
          classified = rft.STATIC_SUPPORTED_EXTENSIONS | rft.LLM_ONLY_EXTENSIONS
          unclassified = ar.REVIEW_EXTENSIONS - classified
          if unclassified:
              errors.append(f"unclassified extensions (add to STATIC or LLM-only): {sorted(unclassified)}")
          overlap = rft.STATIC_SUPPORTED_EXTENSIONS & rft.LLM_ONLY_EXTENSIONS
          if overlap:
              errors.append(f"extension in both sets: {sorted(overlap)}")

          # every static-supported extension must have >=1 fixture, else the
          # static scanner is unexercised on that extension.
          for ext in sorted(rft.STATIC_SUPPORTED_EXTENSIONS):
              n = len(list(Path('tests/fixtures').rglob(f'*{ext}')))
              # .htm and .html share one scanner branch; count .html fixtures too.
              if n == 0 and ext == ".htm":
                  n = len(list(Path('tests/fixtures').rglob('*.html')))
              if n == 0:
                  errors.append(f"no .{ext.lstrip('.')} (.html) fixture - static mode unexercised")
              else:
                  print(f"static {ext}: {n} fixture(s)")

          # LLM-only extensions: no fixture requirement (LLM-only by design),
          # but report counts so a future fixture is visible.
          for ext in sorted(rft.LLM_ONLY_EXTENSIONS):
              n = len(list(Path('tests/fixtures').rglob(f'*{ext}')))
              tag = "smoke fixture present" if n else "no fixture (LLM-only, OK)"
              print(f"LLM-only {ext}: {n} fixture(s) - {tag}")

          if errors:
              for e in errors:
                  print(f"ERROR: {e}", file=sys.stderr)
              sys.exit(1)
          print("Extension coverage: OK")
          EOF

      - name: Toolchain end-to-end (review -> report -> webhook dry-run)
        run: |
          python3 tools/argus_review.py --mode static tests/fixtures/golden/product-card.css --json /tmp/review.json
          python3 tools/argus_report.py --json /tmp/review.json --out /tmp/report.html --wcag
          test -s /tmp/report.html && echo "report.html generated"
          python3 tools/argus_webhook.py send /tmp/review.json --url https://example.invalid/hook --dry-run
          echo "toolchain e2e: ok"

      - name: Upload fixture test results (if any)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fixture-results
          path: fixture-results.json
          if-no-files-found: ignore

  # ── Job 4: Model config change tests (paths-gated) ──────────────────────────
  # Runs the full static suite whenever fallback-model config or its updater
  # changes (#55/#53). Uses dorny/paths-filter (git-diff based) — the naive
  # `github.event.pull_request.changed_files` is an integer count, not a path
  # array, so it cannot gate on paths. On `push`/`schedule` it always runs.
  model-config-tests:
    name: Model Config Change Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt
        with:
          fetch-depth: 0

      - name: Detect model config changes (PR)
        if: github.event_name == 'pull_request'
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            models:
              - 'config/free-models.yml'
              - 'config/model-scores.yml'
              - 'tools/update_free_models.py'
              - 'tools/validate_model_scores.py'
              - '.github/workflows/update-free-models.yml'

      - name: Validate free model list integrity
        if: steps.changes.outputs.models == 'true' || github.event_name != 'pull_request'
        run: |
          python3 tools/update_free_models.py --check

      - name: Run fixture tests (static heuristic mode)
        if: steps.changes.outputs.models == 'true' || github.event_name != 'pull_request'
        run: |
          python3 tools/run_fixture_tests.py

      - name: Verify model-scores.yml parses
        if: steps.changes.outputs.models == 'true' || github.event_name != 'pull_request'
        run: |
          python3 - << 'EOF'
          import sys, pathlib
          sys.path.insert(0, 'tools')
          from update_free_models import _load_model_scores
          scores = _load_model_scores()
          assert len(scores) >= 5, f'expected >=5 scored models, got {len(scores)}'
          print(f'model-scores.yml: {len(scores)} models ok')
          EOF

      - name: Validate model-scores.yml schema
        if: steps.changes.outputs.models == 'true' || github.event_name != 'pull_request'
        run: |
          python3 tools/validate_model_scores.py

  # ── Job 5: LLM fixture tests (optional, graceful degrade) ───────────────────
  # Tracks LLM agent-quality (precision/recall/F1) over time. NOT a gate:
  # free-model output varies run to run, so we record metrics to history and
  # surface regressions as an issue rather than failing PRs. The pinned model
  # is recorded so a regression attributes to rules, not to the weekly model
  # rotation. Preflights the external `opencode` CLI and skips gracefully when
  # it or the API key is missing — static tests still cover regressions (#51).
  llm-fixture-tests:
    name: LLM Fixture Tests (optional)
    runs-on: ubuntu-latest
    needs: validate-tools
    if: github.event_name == 'push' || github.event_name == 'schedule'
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preflight check — opencode CLI present?
        id: cli-check
        run: |
          if command -v opencode >/dev/null 2>&1; then
            echo "opencode CLI found"
            echo "opencode-ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "opencode CLI NOT found — LLM fixture job will be skipped (static tests still cover regressions)"
            echo "opencode-ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run fixture tests in LLM mode (track, not gate)
        if: steps.cli-check.outputs.opencode-ok == 'true' && env.OPENCODE_API_KEY != ''
        run: |
          python3 tools/eval_quality.py --mode llm \
            --json llm-quality-report.json \
            --history config/quality-llm-history.jsonl
          echo "LLM agent-quality metrics recorded to history"

      - name: Upload LLM quality report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: llm-quality-report
          path: |
            llm-quality-report.json
            config/quality-llm-history.jsonl
          if-no-files-found: ignore
