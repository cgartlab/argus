name: Argus Review
description: >
  Frontend design code review via OpenCode, powered by Argus project rules.
  Supports consumer-side .argus.yml configuration for per-repo customization.

inputs:
  github-token:
    description: argus-flash GitHub App installation token
    required: true
  api-key:
    description: >
      OpenCode Zen API key for the LLM provider (optional). When empty,
      falls back to the GitHub App's configured environment. Get a free key
      at https://opencode.ai/auth
    default: ""
  model:
    description: >
      LLM model to use (primary; falls back to fallback queue on error).
      When empty, resolved at runtime from config/free-models.yml primary
      (auto-refreshed every 12 hours), with a last-known-good built-in
      default if the config is missing.
    default: ""
  fallback-models:
    description: >
      Optional comma-separated fallback model queue override. When empty
      (default), the queue is read from config/free-models.yml in this repo,
      which is auto-refreshed every 12 hours from the live opencode model
      list. Set this input to pin an explicit queue for a consumer repo.
    default: ""
  config-path:
    description: >
      Path to the consumer repository's .argus.yml config file, relative to
      the consumer repo root. Defaults to .argus.yml (repo root).
    default: .argus.yml
  fixture-mode:
    description: >
      When set to "true", run Argus against the fixture files in
      tests/fixtures/ for regression validation instead of reviewing a PR.
      Intended for use in the Argus repo's own CI only.
    default: "false"
  opencode-version:
    description: >
      OpenCode CLI version to install. Must be an OpenCode 1.x release:
      this action drives `opencode github run`, which OpenCode 2 removed.
      Pinned to a known-good 1.x by default so an upstream default-installer
      switch to v2 cannot break the action silently.
    default: "1.19.3"

runs:
  using: composite
  steps:
    - name: Validate inputs (fail-fast on missing github-token)
      # Closes #104 — consumers often pass GitHub App credentials
      # (app-id / private-key) instead of an installation token. GitHub
      # Actions only warns about unknown inputs and continues, leaving
      # github-token empty; the downstream `opencode github run` then
      # fails with a confusing error pointing at the GITHUB_TOKEN env
      # variable. This step catches the misconfiguration at the boundary
      # and fails fast with an actionable message.
      shell: bash
      env:
        TOKEN: ${{ inputs.github-token }}
      run: |
        if [ -z "$TOKEN" ]; then
          echo "::error::github-token input is empty or not provided."
          echo "::error::This action expects an argus-flash GitHub App installation token as 'github-token'."
          echo "::error::Common mistake: passing GitHub App credentials 'app-id'/'private-key' in the 'with:' block. GitHub Actions only warns about unknown inputs, so github-token stays empty and 'opencode github run' later fails with a misleading error about GITHUB_TOKEN."
          echo "::error::Fix: use actions/create-github-app-token to mint an installation token, then pass it as github-token."
          echo "::error::Reference: .github/workflows/review.yml in this repo (steps 'Generate argus-flash token' + 'cgartlab/argus/.github/actions/argus-review')."
          exit 1
        fi
    - name: Configure git
      # SECURITY: the token is passed via env, never interpolated into the
      # script text. Interpolated values are materialised into the script
      # before bash parses it, which both breaks on shell metacharacters and
      # exposes the value in step-debug logs.
      #
      # NO TOKEN REMOTE (regression fix).
      # OpenCode's `github run` runs `branchIsDirty() -> pushToLocalBranch()`,
      # i.e. `git add . && git commit && git push` — whatever it finds. That
      # means the review agent can push code to the consumer's PR branch, and
      # on cgartlab/men#170 it did exactly that: twice, identically, it pushed
      # three destructive changes (deleted opencode.json, stripped V2
      # `permissions` from .opencode/agent/men.md, re-added the V1
      # `@opencode-ai/plugin` dependency), breaking 19 of men's 273 tests.
      #
      # The fix removes only the *push credential*. Commit identity is kept so
      # a `git commit` inside the agent session still succeeds — a review agent
      # must be able to finish its review even if it decides to commit, and a
      # hard failure there would take the whole review down. Without a
      # credential on the remote, any push fails instead of authenticating, so
      # destructive changes can never reach the consumer's branch.
      #
      # Posting the review comment does NOT need git: `opencode github run`
      # calls the GitHub API with GITHUB_TOKEN from the environment (see the
      # review step). Reviews therefore keep working.
      #
      # Complementary guard: the "Verify worktree is clean before review" step
      # fails the run if anything is dirty, so agent-created files are caught
      # even though they can no longer be pushed.
      run: |
        # Commit identity: local to this repository only (no --global, which
        # would leak into unrelated repositories on the same runner).
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"
        # Strip any credential from the remote so a `git push` inside the agent
        # session fails rather than authenticating.
        git remote set-url origin "https://github.com/${{ github.repository }}.git"
      shell: bash

    - name: Install OpenCode CLI
      # Download the installer to a temp file before executing (CWE-494: no
      # integrity check on pipe-to-bash). opencode.ai does not publish a
      # checksum URL, so full verification is not yet possible — this at
      # least breaks the pipe-to-bash pattern so the script is inspectable.
      #
      # VERSION PIN: this action drives `opencode github run`, which is an
      # OpenCode 1 command. OpenCode 2 removed it (its CLI exposes only
      # run/api/session/service/...), so an unpinned install would break
      # silently the moment the default installer starts shipping v2.
      # Pin an explicit 1.x version and fail loudly if it cannot be resolved.
      env:
        OPENCODE_CLI_VERSION: ${{ inputs.opencode-version }}
      run: |
        set -euo pipefail
        VERSION="${OPENCODE_CLI_VERSION:-1.19.3}"
        case "$VERSION" in
          1.*) ;;
          *)
            echo "::error::opencode-version must be an OpenCode 1.x release (got '$VERSION')."
            echo "::error::This action depends on 'opencode github run', which OpenCode 2 removed."
            exit 1
            ;;
        esac
        curl -fsSL https://opencode.ai/install -o /tmp/opencode-install.sh
        test -s /tmp/opencode-install.sh
        bash /tmp/opencode-install.sh --version "$VERSION"
        # The installer appends its bin dir to $GITHUB_PATH, which only takes
        # effect for *later* steps. Export it for this step too so the version
        # check below works; the check itself is non-fatal so a PATH quirk can
        # never fail an otherwise-good install.
        export PATH="$HOME/.opencode/bin:$PATH"
        echo "[argus] OpenCode CLI pinned to $VERSION"
        opencode --version || echo "[argus] warning: could not read installed version (non-fatal)"
      shell: bash

    - name: Load consumer configuration (.argus.yml)
      id: load-config
      # SECURITY: inputs.* are supplied by the calling repo via `with:` and are
      # NOT masked by the runner. Interpolating them into `run:` lets the text
      # execute as shell. Pass via `env:` so they arrive as inert data.
      env:
        CONFIG_PATH: ${{ inputs.config-path }}
      run: |
        # If the consumer has a .argus.yml, validate and emit env vars.
        # If not present, load_config.py will silently use defaults.
        python3 ${{ github.action_path }}/../../../tools/load_config.py \
          --config "$CONFIG_PATH" \
          --output-env

        # Surface which config source was used for debug visibility
        if [ -f "$CONFIG_PATH" ]; then
          echo "ARGUS_CONFIG_SOURCE=$CONFIG_PATH" >> $GITHUB_ENV
          echo "[argus] Loaded consumer config from $CONFIG_PATH"
        else
          echo "ARGUS_CONFIG_SOURCE=defaults" >> $GITHUB_ENV
          echo "[argus] No $CONFIG_PATH found — using built-in defaults"
        fi
      shell: bash

    - name: Detect design system
      id: detect-system
      run: |
        # Explicit .argus.yml wins; otherwise parse package.json precisely.
        DESIGN_SYSTEM="${ARGUS_DESIGN_SYSTEM:-auto}"
        if [ "$DESIGN_SYSTEM" = "auto" ] && [ -f package.json ]; then
          DESIGN_SYSTEM=$(python3 - <<'PY'
        import json, sys
        try:
            data = json.load(open("package.json", encoding="utf-8"))
        except Exception:
            sys.exit(0)  # no/invalid package.json -> default custom
        deps = {}
        deps.update(data.get("dependencies", {}))
        deps.update(data.get("devDependencies", {}))
        if "antd" in deps:
            major = deps["antd"].lstrip("^~").split(".")[0]
            try:
                print("antd5" if int(major) >= 5 else "antd4-unsupported")
            except ValueError:
                print("antd5")
        elif "@mui/material" in deps:
            print("material3")
        elif "@shopify/polaris" in deps:
            print("polaris")
        else:
            print("custom")
        PY
        )
        fi
        echo "ARGUS_DESIGN_SYSTEM=${DESIGN_SYSTEM:-custom}" >> $GITHUB_ENV
        echo "[argus] Detected design system: ${DESIGN_SYSTEM:-custom}"
      shell: bash

    - name: Build review prompt from Argus rules
      id: prompt
      run: |
        {
          echo "PROMPT<<EOF"
          echo "You are Argus, a frontend design code review agent."
          echo ""
          echo "## Argus Hard Rules"
          cat ${{ github.action_path }}/../../../AGENTS.md
          echo ""

          # Inject design token mapping if a known system is detected
          TOKEN_FILE="${{ github.action_path }}/../../../.github/tokens/$ARGUS_DESIGN_SYSTEM.json"
          if [ "$ARGUS_DESIGN_SYSTEM" = "antd4-unsupported" ]; then
            echo "## Design System: antd v4 (unsupported)"
            echo "antd v4 uses Less variables, not CSS custom properties."
            echo "Configure design-system: custom in .argus.yml, or migrate to antd v5."
            echo ""
          elif [ -n "$ARGUS_DESIGN_SYSTEM" ] && [ "$ARGUS_DESIGN_SYSTEM" != "custom" ] && [ -f "$TOKEN_FILE" ]; then
            echo "## Design System: $ARGUS_DESIGN_SYSTEM"
            echo "Reference these design tokens when suggesting fixes:"
            cat "$TOKEN_FILE"
            echo ""
          elif [ "$ARGUS_DESIGN_SYSTEM" = "custom" ] || [ -z "$ARGUS_DESIGN_SYSTEM" ]; then
            echo "## Custom Design System"
            echo "No known design-token system detected. Treat any \`var(--<any-name>)\` as a valid design token reference."
            echo ""
          fi

          echo "## Review Dimensions"
          cat ${{ github.action_path }}/../../../SKILL.md
          echo ""

          # Inject the consumer's project lesson file (.argus/LESSONS.md) if present.
          # Absent file == no behavior change. Path is configurable via .argus.yml
          # (ARGUS_LESSONS_PATH, default .argus/LESSONS.md).
          LESSONS_FILE="$GITHUB_WORKSPACE/${ARGUS_LESSONS_PATH:-.argus/LESSONS.md}"
          if [ -f "$LESSONS_FILE" ]; then
            echo "## Project Lessons (do not repeat these mistakes)"
            cat "$LESSONS_FILE"
            echo ""
          fi

          # Inject consumer configuration context if present
          if [ -n "$ARGUS_TOKEN_PREFIX" ] && [ "$ARGUS_TOKEN_PREFIX" != "--ds-" ]; then
            echo "## Consumer Configuration"
            echo "Design token prefix for this repository: \`$ARGUS_TOKEN_PREFIX\`"
            echo "Treat any \`var($ARGUS_TOKEN_PREFIX*)\` as a valid design token reference."
            echo ""
          fi

          if [ -n "$ARGUS_IGNORE_RULES" ]; then
            echo "## Disabled Rules (per .argus.yml)"
            echo "The following rule IDs are disabled for this repository: $ARGUS_IGNORE_RULES"
            echo "Do NOT report findings for these rules."
            echo ""
          fi

          if [ -n "$ARGUS_IGNORE_PATHS" ]; then
            echo "## Ignored Paths (per .argus.yml)"
            echo "Skip any files matching these patterns:"
            echo "$ARGUS_IGNORE_PATHS"
            echo ""
          fi

          echo "## Failure Threshold"
          echo "Block-level severities for this repository: ${ARGUS_FAIL_ON:-P0,P1}"
          echo ""
          echo "Review ALL frontend code in this PR."
          echo "Group output by severity: P0 (blocking) -> P1 (high) -> P2 (medium) -> P3 (polish)."
          echo "For every issue show: Found vs Expected, and name the exact design token."
          echo "Cap total findings to ${ARGUS_MAX_FINDINGS:-50} (report highest severity first)."
          echo "EOF"
        } >> $GITHUB_ENV
        if [ -f "$LESSONS_FILE" ]; then
          echo "[argus] loaded project lessons from ${ARGUS_LESSONS_PATH:-.argus/LESSONS.md}"
        else
          echo "[argus] no project lesson file found (using defaults)"
        fi
      shell: bash

    - name: Quarantine V2-only opencode config (V1 CLI compatibility)
      # The installer above pins OpenCode 1, whose config parser rejects the V2
      # ordered `permissions` array with:
      #   "V2 permissions are not supported by OpenCode V1"
      # Consumer repos may legitimately keep V2 config (that is what their own
      # local V2 CLI reads), so the V2 keys are neutralised in place for the
      # duration of the run and restored byte-for-byte on exit.
      #
      # Detection is content-based, not filename-based: a file is touched only
      # when it actually carries a V2 `permissions` array, so V1-only consumers
      # are entirely untouched.
      #
      # WHY IN-PLACE + --skip-worktree AND NOT `rm` (regression from cgartlab/men@a21a4c44):
      #   OpenCode v1.19.3 commits the working tree whenever it is dirty --
      #   branchIsDirty() is a bare `git status --porcelain` check and
      #   pushToLocalBranch() follows with `git add .` -> `git commit` ->
      #   `git push` (packages/opencode/src/github/index.ts, tag v1.19.3). The
      #   old `rm` therefore made the worktree dirty and the *deletions of the
      #   consumer's own V2 config* were pushed onto their PR branch, silently
      #   downgrading it to V1. Restoring afterwards is too late: the CLI has
      #   already committed and pushed by the time this action's next step runs.
      #   `git update-index --skip-worktree` makes git treat the rewritten path
      #   as untouched, so status stays empty and the CLI commits nothing.
      #   Untracked paths cannot be skip-worktree'd, so they are additionally
      #   hidden in .git/info/exclude (worktree-local, never committed).
      #
      # The V1 CLI also rewrites .opencode/package.json itself (adding the
      # @opencode-ai/plugin dependency it boots with) and may drop a lockfile
      # beside it. Those carry no V2 config but dirty the worktree the same
      # way, so they are masked unconditionally.
      run: |
        set -euo pipefail
        QUARANTINE_DIR="$(mktemp -d -t argus-quarantine-XXXXXX)"
        : > "$QUARANTINE_DIR/manifest"
        echo "QUARANTINE_DIR=$QUARANTINE_DIR" >> "$GITHUB_ENV"

        # Record a path we are about to hide. Its backup must already exist in
        # $QUARANTINE_DIR -- every caller copies first -- because restore
        # replays this manifest by copying the backup back.
        mask() {
          local rel="$1"
          echo "$rel" >> "$QUARANTINE_DIR/manifest"
          if git ls-files --error-unmatch -- "$rel" >/dev/null 2>&1; then
            git update-index --skip-worktree -- "$rel"
          fi
        }

        # Refuse to run a review against config the V1 CLI cannot parse. A
        # confusing parser crash would be worse than a red check, and this is
        # the only case where the quarantine cannot hide anything.
        fail_quarantine() {
          echo "::error::[argus] could not neutralise V2 permissions in $1 -- refusing to run a review against config the V1 CLI cannot parse"
          exit 1
        }

        # Remove every `permissions` array from opencode.json, leaving the rest
        # of the config ($schema, default_agent, agent models) intact so the V1
        # CLI still gets a working file instead of a missing one.
        neutralise_json_permissions() {
          python3 - "$1" <<'PY'
        import json
        import re
        import sys

        p = sys.argv[1]
        src = open(p, encoding="utf-8").read()
        ARRAY_KEY = re.compile(r'"permissions"[ \t]*:[ \t]*\[')

        def strip(v):
            if isinstance(v, dict):
                return {
                    k: strip(x)
                    for k, x in v.items()
                    if not (k == "permissions" and isinstance(x, list))
                }
            if isinstance(v, list):
                return [strip(x) for x in v]
            return v

        try:
            data = json.loads(src)
        except Exception:
            data = None  # JSONC (comments / trailing commas); see below

        if data is not None:
            open(p, "w", encoding="utf-8").write(
                json.dumps(strip(data), indent=2, ensure_ascii=False) + "\n"
            )
        else:
            # Remove only each `"permissions": [...]` pair so comments and every
            # other byte survive. A comma left dangling at the object's end
            # would invalidate the JSON, so drop it along with the pair.
            out = []
            i = 0
            while True:
                m = ARRAY_KEY.search(src, i)
                if m is None:
                    out.append(src[i:])
                    break
                j = src.index("[", m.start())
                depth = 0
                in_str = False
                escaped = False
                while j < len(src):
                    c = src[j]
                    if in_str:
                        if escaped:
                            escaped = False
                        elif c == "\\":
                            escaped = True
                        elif c == '"':
                            in_str = False
                    elif c == '"':
                        in_str = True
                    elif c == "[":
                        depth += 1
                    elif c == "]":
                        depth -= 1
                        if depth == 0:
                            j += 1
                            break
                    j += 1
                if depth != 0:
                    sys.exit(1)  # unbalanced brackets: refuse to guess
                out.append(re.sub(r",\s*$", "", src[i : m.start()]))
                i = j
            open(p, "w", encoding="utf-8").write("".join(out))

        # Success means no V2 array is left for the V1 parser to choke on.
        if ARRAY_KEY.search(open(p, encoding="utf-8").read()):
            sys.exit(1)
        PY
        }

        for rel in opencode.json .opencode/opencode.json; do
          [ -f "$rel" ] || continue
          grep -Eq '"permissions"[[:space:]]*:[[:space:]]*\[' "$rel" || continue
          # Back up BEFORE neutralising, so restore can bring the original bytes
          # back. Backing up afterwards would restore the neutralised config and
          # silently downgrade the consumer's V2 file again.
          cp -p "$rel" "$QUARANTINE_DIR/$(echo "$rel" | tr '/' '_')"
          neutralise_json_permissions "$rel" || fail_quarantine "$rel"
          mask "$rel"
          echo "[argus] neutralised V2 permissions in $rel (kept in place for the V1 CLI)"
        done

        # Agent markdown frontmatter can also carry a V2 permissions block.
        for f in .opencode/agent/*.md; do
          [ -f "$f" ] || continue
          grep -Eq '^permissions:[[:space:]]*$' "$f" || continue
          dest="$QUARANTINE_DIR/$(echo "$f" | tr '/' '_')"
          cp -p "$f" "$dest"
          # Strip only the V2 permission block from frontmatter; keep the agent
          # definition itself so routing/description still work.
          # The block is a top-level key followed by indented lines only.
          # Deliberately does NOT consume blank lines or the closing `---`,
          # otherwise the frontmatter would be left unterminated.
          python3 - "$f" <<'PY'
        import re
        import sys
        p = sys.argv[1]
        src = open(p, encoding="utf-8").read()
        src = re.sub(r"(?m)^permissions:[ \t]*\n(?:[ \t]+[^\n]*\n)+", "", src, count=1)
        open(p, "w", encoding="utf-8").write(src)
        PY
          if grep -Eq '^permissions:[[:space:]]*$' "$f"; then
            fail_quarantine "$f"
          fi
          mask "$f"
          echo "[argus] stripped V2 permissions from agent frontmatter: $f"
        done

        # The V1 CLI writes these while booting; they carry no V2 config, so
        # only mask them. A path that does not exist yet is recorded anyway, so
        # the .git/info/exclude block below hides a lockfile the CLI creates
        # mid-run before this step's summary is printed.
        for rel in .opencode/package.json .opencode/bun.lock .opencode/package-lock.json; do
          if [ -f "$rel" ]; then
            cp -p "$rel" "$QUARANTINE_DIR/$(echo "$rel" | tr '/' '_')"
          fi
          mask "$rel"
        done

        # Untracked paths cannot be hidden with --skip-worktree (git rejects the
        # path), so hide every masked path in .git/info/exclude. That file is
        # worktree-local and never committed; the restore step deletes this
        # block. Without it, a lockfile the V1 CLI creates mid-run would show as
        # untracked and be swept into the CLI's own `git add .` commit.
        GITDIR="$(git rev-parse --git-dir 2>/dev/null || echo "")"
        if [ -n "$GITDIR" ] && [ -d "$GITDIR" ]; then
          {
            echo "# argus-quarantine:BEGIN"
            cat "$QUARANTINE_DIR/manifest"
            echo "# argus-quarantine:END"
          } >> "$GITDIR/info/exclude"
        else
          echo "::warning::[argus] not inside a git repository -- quarantine cannot be hidden from git"
        fi

        echo "[argus] V1 compatibility quarantine applied to $(wc -l < "$QUARANTINE_DIR/manifest") path(s)"
      shell: bash

    - name: Verify worktree is clean before review
      if: inputs.fixture-mode == 'false'
      # OpenCode v1.19.3 publishes whatever it finds: branchIsDirty() is
      # `git status --porcelain` being non-empty, and pushToLocalBranch() then
      # runs `git add .` -> `git commit` -> `git push` onto the consumer's PR
      # branch. The quarantine step hides its own rewrites, so a non-empty
      # status here means something the review must NOT ship -- an earlier
      # step's artifact, or a masking failure. Fail closed: a red check beats a
      # silently polluted consumer branch (cgartlab/men@a21a4c44).
      shell: bash
      run: |
        set -uo pipefail
        dirty="$(git status --porcelain)"
        if [ -z "$dirty" ]; then
          echo "[argus] worktree clean before review (quarantine hidden from git)"
        else
          echo "::error::Worktree is dirty before the review starts:"
          echo "$dirty" | sed 's/^/::error::  /'
          echo "::error::OpenCode's 'github run' commits whatever it finds (branchIsDirty() -> pushToLocalBranch(): git add . && git commit && git push)."
          echo "::error::Those paths would be pushed to the consumer's PR branch. Fix the step that created them, or add them to .gitignore, then re-run."
          exit 1
        fi

    - name: Run OpenCode review (with fallback queue)
      if: inputs.fixture-mode == 'false'
      shell: bash
      run: |
        # Auth: only export when the consumer supplied a key — never override
        # an existing environment value (e.g. the GitHub App's configured key).
        if [ -n "$INPUT_API_KEY" ]; then
          export OPENCODE_API_KEY="$INPUT_API_KEY"
        fi
        if [ -n "$OPENCODE_API_KEY" ]; then
          echo "[argus] OpenCode API key: configured"
        else
          echo "[argus] OpenCode API key: unset"
        fi

        # Resolve primary model: explicit input wins; otherwise read from the
        # auto-refreshed config/free-models.yml (refreshed weekly by the
        # update-free-models workflow); last resort is a last-known-good default.
        PRIMARY_MODEL="$INPUT_MODEL"
        if [ -z "$PRIMARY_MODEL" ]; then
          MODELS_FILE="${{ github.action_path }}/../../../config/free-models.yml"
          if [ -f "$MODELS_FILE" ]; then
            PRIMARY_MODEL=$(grep -E '^primary:' "$MODELS_FILE" | head -1 | cut -d: -f2- | xargs)
          fi
        fi
        if [ -z "$PRIMARY_MODEL" ]; then
          echo "[argus] ⚠ No primary model configured; using last-known-good default"
          PRIMARY_MODEL="opencode/nemotron-3-ultra-free"
        fi

        run_with_fallback_queue() {
          local primary_model="$1"
          local fallback_models="$2"
          local exit_code=0
          local primary_output=""
          local primary_exit_code=0

          # Shared regexes:
          #   retry_re — rate-limit, model-unavailable, OR transient
          #              upstream/gateway failure (5xx). The fallback queue
          #              helps for all three: each zen model maps to a
          #              different upstream, so a 503 from one provider
          #              (e.g. "Upstream error from Nvidia: Service
          #              temporarily overloaded") can still succeed on the
          #              next. Patterns stay phrase-specific on purpose —
          #              bare `unavailable` / bare `5xx` digits were dropped
          #              because line numbers and review prose matched them.
          #              NOTE: tools/run_fixture_tests.py mirrors this regex
          #              in _is_retryable() — update both together.
          #   auth_re  — missing/invalid API key (every zen model shares the
          #              same key, so the fallback queue fails identically;
          #              fail fast with guidance instead of pointless retries)
          local retry_re="429[[:space:]]+(rate|too|exceeded|limit(ed|s)?)[[:space:]]|rate[[:space:]]*limit|too many requests|model[[:space:]]+not[[:space:]]+found|no[[:space:]]+such[[:space:]]+model|model[[:space:]]+does[[:space:]]+not[[:space:]]+exist|upstream request failed|upstream[[:space:]]+error|endpoint is unavailable|service[[:space:]]+temporarily[[:space:]]+overloaded|temporarily[[:space:]]+overloaded|service[[:space:]]+unavailable|server_error|bad[[:space:]]+gateway|gateway[[:space:]]+timeout"
          local auth_re="401[[:space:]]+(unauthorized|invalid)|403[[:space:]]+(forbidden|invalid)|unauthorized|authentication[[:space:]]+(failed|error)|invalid[[:space:]]+api[[:space:]]+key|missing[[:space:]]+api[[:space:]]+key"

          print_auth_guidance() {
            # Build the guidance text with the GitHub-expression literal
            # (lbrace + rbrace tokens) split so the runner does not try to
            # evaluate it as an expression here.
            # printf keeps every line as a single YAML-safe argument (block
            # scalars cannot contain dedented continuation lines).
            # NOTE: We must never write the GitHub-expression delimiter
            # (dollar + two left braces / two right braces) literally
            # inside this `run` block — the Actions template parser would
            # treat it as an expression and fail. Instead we assemble the
            # braces via shell variable expansion, which the template
            # layer ignores.
            local dollar='$'
            local lbrace="${dollar}{{"
            local rbrace="}}"
            local guidance
            guidance="$(printf '%s\n' \
              '[argus] 🚨 No usable OpenCode Zen API key detected.' \
              'The primary model and all fallbacks require an OpenCode Zen API key.' \
              '' \
              'How to fix (2 minutes):' \
              '  Step 1: Register a free account at https://opencode.ai' \
              '  Step 2: Create an API key at https://opencode.ai/auth' \
              '  Step 3: Add it to this repo: Settings → Secrets and variables → Actions →' \
              '          New repository secret → name `OPENCODE_API_KEY`, paste your key' \
              '  Step 4: Your workflow passes it via' \
              "          \`api-key: ${lbrace} secrets.OPENCODE_API_KEY ${rbrace}\` (default template)." \
              '  Step 5: Re-run this workflow.' \
              '' \
              'Alternatively configure your own LLM provider key if supported.')"
            echo "$guidance"
            # Best-effort: post the same guidance as a PR comment (never blocks).
            local pr_number="${{ github.event.pull_request.number }}"
            if [ -n "$pr_number" ]; then
              gh api repos/${{ github.repository }}/issues/${pr_number}/comments \
                -X POST --field body="$guidance" >/dev/null 2>&1 || true
            fi
          }

          echo "[argus] Using model: $primary_model"
          export MODEL="$primary_model"

          # Try primary model
          primary_output=$(opencode github run 2>&1) || primary_exit_code=$?

          if [ $primary_exit_code -eq 0 ]; then
            echo "$primary_output"
            echo "[argus] ✓ Review completed with model: $primary_model"
            return 0
          fi

          # Auth failure — fail fast with guidance (all zen models share the
          # same key, so retrying the fallback queue would produce the same 401s).
          if echo "$primary_output" | grep -qiE "$auth_re"; then
            echo "$primary_output" | tail -5
            print_auth_guidance
            return $primary_exit_code
          fi

          # Check if retryable (rate-limited / model unavailable)
          if ! echo "$primary_output" | grep -qiE "$retry_re"; then
            # Not a retryable condition — fail as-is
            echo "$primary_output"
            return $primary_exit_code
          fi

          echo "[argus] ⚠ Primary model '$primary_model' retryable (rate-limited or unavailable)"
          echo "$primary_output"

          # Dismiss any pending or stale review the primary model may have
          # posted before failing, so the fallback doesn't create a duplicate
          # conflicting review on the same PR.
          dismiss_stale_reviews() {
            local pr_number="${{ github.event.pull_request.number }}"
            [ -z "$pr_number" ] && return 0
            echo "[argus] Dismissing stale/pending reviews from failed primary run..."
            reviews=$(gh api repos/${{ github.repository }}/pulls/${pr_number}/reviews \
                        --jq '.[] | select(.state == "PENDING" or .state == "COMMENTED") | .id' 2>/dev/null || true)
            for rid in $reviews; do
              gh api repos/${{ github.repository }}/pulls/${pr_number}/reviews/${rid}/dismissals \
                -X PUT -f event=DISMISS \
                -f message="Dismissed incomplete review before fallback retry" 2>/dev/null \
                && echo "[argus]   Dismissed review #${rid}" \
                || true
            done
          }
          dismiss_stale_reviews

          # Iterate through fallback queue.
          # Each `opencode github run` may post a PR review comment. Stale
          # reviews from the failed primary run have been dismissed above.
          local output=""
          IFS=',' read -ra queue <<< "$fallback_models"
          for fb_model in "${queue[@]}"; do
            fb_model=$(echo "$fb_model" | xargs)  # trim whitespace
            [ -z "$fb_model" ] && continue
            echo "[argus] → Trying fallback: $fb_model"
            export MODEL="$fb_model"
            exit_code=0
            output=$(opencode github run 2>&1) || exit_code=$?
            if [ $exit_code -eq 0 ]; then
              echo "$output"
              echo "[argus] ✓ Review completed with fallback model: $fb_model"
              return 0
            fi
            # Auth failure — same key issue, stop trying and guide the user.
            if echo "$output" | grep -qiE "$auth_re"; then
              echo "[argus] ⚠ Fallback '$fb_model' failed (auth): all zen models require the same API key"
              dismiss_stale_reviews
              print_auth_guidance
              return $exit_code
            fi
            if echo "$output" | grep -qiE "$retry_re"; then
              echo "[argus] ⚠ Fallback '$fb_model' rate-limited or unavailable, trying next..."
            else
              # Non-retryable — log diagnostic tail but continue trying next model.
              # Previously this caused the review to abort (return $exit_code).
              echo "[argus] ⚠ Fallback '$fb_model' failed (non-retryable):"
              echo "$output" | tail -5
            fi
            # This failed fallback may have posted a PENDING/COMMENTED review —
            # clear it before trying the next model to avoid duplicate comments.
            dismiss_stale_reviews
          done

          # All fallbacks exhausted — keep primary output and its exit code
          echo "[argus] ✗ All fallback models exhausted; keeping primary output"
          if [ -z "$primary_output" ]; then
            echo "[argus] ✗ Primary model produced no output (exit code: $primary_exit_code). No review was generated."
            echo "[argus]   Possible causes: timeout killed the process, network issue, or model hang."
            echo "[argus]   Action failed without a review comment — check the step log for the underlying error."
          else
            echo "$primary_output"
          fi
          return $primary_exit_code
        }

        # Resolve fallback queue: explicit input wins, otherwise read from the
        # auto-refreshed config/free-models.yml (updated every 12h by the
        # update-free-models workflow). Missing config is a hard error — this
        # repo must commit config/free-models.yml.
        FALLBACK_MODELS="$INPUT_FALLBACK_MODELS"
        if [ -z "$FALLBACK_MODELS" ]; then
          MODELS_FILE="${{ github.action_path }}/../../../config/free-models.yml"
          if [ -f "$MODELS_FILE" ]; then
            FALLBACK_MODELS=$(grep -E '^fallback_models:' "$MODELS_FILE" | head -1 | cut -d: -f2- | xargs)
          fi
        fi
        if [ -z "$FALLBACK_MODELS" ]; then
          echo "[argus] ✗ No fallback models configured and config/free-models.yml is missing — cannot run review"
          echo "[argus]   This repository must contain config/free-models.yml (committed by tools/update_free_models.py)."
          exit 1
        fi
        echo "[argus] Fallback queue: $FALLBACK_MODELS"

        run_with_fallback_queue "$PRIMARY_MODEL" "$FALLBACK_MODELS"
      env:
        # SECURITY: caller-controlled inputs are delivered as environment
        # variables (inert data), never interpolated into the script body.
        # See the "Configure git" step for the rationale.
        GITHUB_TOKEN: ${{ inputs.github-token }}
        USE_GITHUB_TOKEN: "true"
        PROMPT: ${{ env.PROMPT }}
        OPENCODE_API_KEY: ${{ inputs.api-key }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_FALLBACK_MODELS: ${{ inputs.fallback-models }}

    - name: Restore quarantined opencode config
      if: always()
      # Always restore, so a failed review never leaves the consumer repo with
      # its config neutralised (later steps or retries may need it).
      #
      # The --skip-worktree flags and the .git/info/exclude block MUST both be
      # cleared, or the consumer's own git would keep treating these paths as
      # untouched and keep hiding real edits long after this action finished.
      run: |
        set -uo pipefail
        if [ -z "${QUARANTINE_DIR:-}" ] || [ ! -f "$QUARANTINE_DIR/manifest" ]; then
          echo "[argus] nothing to restore"
          exit 0
        fi
        GITDIR="$(git rev-parse --git-dir 2>/dev/null || echo "")"
        if [ -n "$GITDIR" ] && [ -f "$GITDIR/info/exclude" ]; then
          # awk + temp file instead of `sed -i`: BSD sed (macOS self-hosted
          # runners) needs `sed -i ''`, so an in-place sed would break there.
          awk '
            /^# argus-quarantine:BEGIN$/ { skip = 1; next }
            /^# argus-quarantine:END$/   { skip = 0; next }
            skip != 1 { print }
          ' "$GITDIR/info/exclude" > "$QUARANTINE_DIR/exclude.filtered" \
            && mv "$QUARANTINE_DIR/exclude.filtered" "$GITDIR/info/exclude"
        fi
        while IFS= read -r rel; do
          [ -n "$rel" ] || continue
          # Clear the flag before writing, so the path is never left both
          # visible to git and still carrying the neutralised content.
          git update-index --no-skip-worktree -- "$rel" 2>/dev/null || true
          src="$QUARANTINE_DIR/$(echo "$rel" | tr '/' '_')"
          if [ -f "$src" ]; then
            mkdir -p "$(dirname "$rel")"
            cp -p "$src" "$rel"
            echo "[argus] restored $rel"
          else
            # No backup means the path did not exist when quarantine ran, so
            # anything there now is a CLI side effect (typically
            # .opencode/package-lock.json). Delete it rather than committing it.
            if [ -e "$rel" ]; then
              rm -f -- "$rel"
              echo "[argus] removed CLI side effect: $rel"
            fi
          fi
        done < "$QUARANTINE_DIR/manifest"
        rm -rf "$QUARANTINE_DIR"
      shell: bash

    - name: Scrub token from git config
      if: always()
      # "Configure git" no longer writes a token-bearing remote, so this step is
      # defence in depth in two stages:
      #   1. restore the credential-free remote unconditionally — the behaviour
      #      this step always had. A cleanup step must clean, not just complain,
      #      otherwise a stray credential would survive the run.
      #   2. then verify it really is gone, so a future regression that writes a
      #      credential somewhere else still fails loudly in CI.
      run: |
        git remote set-url origin "https://github.com/${{ github.repository }}.git"
        if git config --get-regexp 'remote\..*\.url' 2>/dev/null | grep -Eq 'x-access-token|oauth2|ghp_|github_pat_'; then
          echo "::error::A credential-bearing git remote is still configured after scrubbing; refusing to continue."
          exit 1
        fi
        echo "[argus] git remotes carry no credentials"
      shell: bash

    - name: Run fixture regression tests
      if: inputs.fixture-mode == 'true'
      # SECURITY: inputs arrive via env as inert data (see Configure git).
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_FALLBACK_MODELS: ${{ inputs.fallback-models }}
      run: |
        EXTRA_ARGS=()
        if [ -n "$INPUT_MODEL" ]; then
          EXTRA_ARGS+=(--model "$INPUT_MODEL")
        fi
        if [ -n "$INPUT_FALLBACK_MODELS" ]; then
          EXTRA_ARGS+=(--fallback-models "$INPUT_FALLBACK_MODELS")
        fi
        python3 "${{ github.action_path }}/../../../tools/run_fixture_tests.py" \
          "${EXTRA_ARGS[@]}" \
          --json fixture-results.json
      shell: bash