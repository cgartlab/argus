name: Argus Review
description: >
  Frontend design code review via OpenCode, powered by Argus project rules.
  Supports consumer-side .argus.yml configuration for per-repo customization.

inputs:
  github-token:
    description: argus-flash GitHub App installation token
    required: true
  model:
    description: LLM model to use
    default: opencode/deepseek-v4-flash-free
  fallback-models:
    description: >
      Optional comma-separated fallback model queue override. When empty
      (default), the queue is read from config/free-models.yml in this repo,
      which is auto-refreshed every 12 hours from the live opencode model
      list. Set this input to pin an explicit queue for a consumer repo.
    default: ""
  config-path:
    description: >
      Path to the consumer repository's .argus.yml config file, relative to
      the consumer repo root. Defaults to .argus.yml (repo root).
    default: .argus.yml
  fixture-mode:
    description: >
      When set to "true", run Argus against the fixture files in
      tests/fixtures/ for regression validation instead of reviewing a PR.
      Intended for use in the Argus repo's own CI only.
    default: "false"

runs:
  using: composite
  steps:
    - name: Configure git
      run: |
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        git remote set-url origin https://x-access-token:${{ inputs.github-token }}@github.com/${{ github.repository }}.git
      shell: bash

    - name: Install OpenCode CLI
      run: curl -fsSL https://opencode.ai/install | bash
      shell: bash

    - name: Load consumer configuration (.argus.yml)
      id: load-config
      run: |
        CONFIG_PATH="${{ inputs.config-path }}"

        # If the consumer has a .argus.yml, validate and emit env vars.
        # If not present, load_config.py will silently use defaults.
        python3 ${{ github.action_path }}/../../../tools/load_config.py \
          --config "$CONFIG_PATH" \
          --output-env

        # Surface which config source was used for debug visibility
        if [ -f "$CONFIG_PATH" ]; then
          echo "ARGUS_CONFIG_SOURCE=$CONFIG_PATH" >> $GITHUB_ENV
          echo "[argus] Loaded consumer config from $CONFIG_PATH"
        else
          echo "ARGUS_CONFIG_SOURCE=defaults" >> $GITHUB_ENV
          echo "[argus] No $CONFIG_PATH found — using built-in defaults"
        fi
      shell: bash

    - name: Build review prompt from Argus rules
      id: prompt
      run: |
        {
          echo "PROMPT<<EOF"
          echo "You are Argus, a frontend design code review agent."
          echo ""
          echo "## Argus Hard Rules"
          cat ${{ github.action_path }}/../../../AGENTS.md
          echo ""
          echo "## Review Dimensions"
          cat ${{ github.action_path }}/../../../SKILL.md
          echo ""

          # Inject consumer configuration context if present
          if [ -n "$ARGUS_TOKEN_PREFIX" ] && [ "$ARGUS_TOKEN_PREFIX" != "--ds-" ]; then
            echo "## Consumer Configuration"
            echo "Design token prefix for this repository: \`$ARGUS_TOKEN_PREFIX\`"
            echo "Treat any \`var($ARGUS_TOKEN_PREFIX*)\` as a valid design token reference."
            echo ""
          fi

          if [ -n "$ARGUS_IGNORE_RULES" ]; then
            echo "## Disabled Rules (per .argus.yml)"
            echo "The following rule IDs are disabled for this repository: $ARGUS_IGNORE_RULES"
            echo "Do NOT report findings for these rules."
            echo ""
          fi

          if [ -n "$ARGUS_IGNORE_PATHS" ]; then
            echo "## Ignored Paths (per .argus.yml)"
            echo "Skip any files matching these patterns:"
            echo "$ARGUS_IGNORE_PATHS"
            echo ""
          fi

          echo "## Failure Threshold"
          echo "Block-level severities for this repository: ${ARGUS_FAIL_ON:-P0,P1}"
          echo ""
          echo "Review ALL frontend code in this PR."
          echo "Group output by severity: P0 (blocking) -> P1 (high) -> P2 (medium) -> P3 (polish)."
          echo "For every issue show: Found vs Expected, and name the exact design token."
          echo "Cap total findings to ${ARGUS_MAX_FINDINGS:-50} (report highest severity first)."
          echo "EOF"
        } >> $GITHUB_ENV
      shell: bash

    - name: Run OpenCode review (with fallback queue)
      if: inputs.fixture-mode == 'false'
      shell: bash
      run: |
        run_with_fallback_queue() {
          local primary_model="$1"
          local fallback_models="$2"
          local exit_code=0
          local primary_output=""
          local primary_exit_code=0

          # Shared regex: retryable conditions (rate-limit OR model-unavailable)
          local retry_re="429[[:space:]]+(rate|too|exceeded|limit(ed|s)?)[[:space:]]|rate[[:space:]]*limit|too many requests|model[[:space:]]+not[[:space:]]+found|no[[:space:]]+such[[:space:]]+model|model[[:space:]]+does[[:space:]]+not[[:space:]]+exist|upstream request failed|endpoint is unavailable|unavailable"

          echo "[argus] Using model: $primary_model"
          export MODEL="$primary_model"

          # Try primary model
          primary_output=$(opencode github run 2>&1) || primary_exit_code=$?

          if [ $primary_exit_code -eq 0 ]; then
            echo "$primary_output"
            echo "[argus] ✓ Review completed with model: $primary_model"
            return 0
          fi

          # Check if retryable (rate-limited / model unavailable)
          if ! echo "$primary_output" | grep -qiE "$retry_re"; then
            # Not a retryable condition — fail as-is
            echo "$primary_output"
            return $primary_exit_code
          fi

          echo "[argus] ⚠ Primary model '$primary_model' retryable (rate-limited or unavailable)"
          echo "$primary_output"

          # Iterate through fallback queue.
          # NOTE: each `opencode github run` invocation posts its own PR review
          # comment. If the primary already posted a comment and then failed
          # (e.g. 429), a successful fallback posts a SECOND, potentially
          # conflicting review on the same PR. Accepted trade-off for resilience.
          local output=""
          IFS=',' read -ra queue <<< "$fallback_models"
          for fb_model in "${queue[@]}"; do
            fb_model=$(echo "$fb_model" | xargs)  # trim whitespace
            [ -z "$fb_model" ] && continue
            echo "[argus] → Trying fallback: $fb_model"
            export MODEL="$fb_model"
            exit_code=0
            output=$(opencode github run 2>&1) || exit_code=$?
            if [ $exit_code -eq 0 ]; then
              echo "$output"
              echo "[argus] ✓ Review completed with fallback model: $fb_model"
              return 0
            fi
            if echo "$output" | grep -qiE "$retry_re"; then
              echo "[argus] ⚠ Fallback '$fb_model' rate-limited or unavailable, trying next..."
            else
              # Non-retryable — log diagnostic tail but continue trying next model.
              # Previously this caused the review to abort (return $exit_code).
              echo "[argus] ⚠ Fallback '$fb_model' failed (non-retryable):"
              echo "$output" | tail -5
            fi
          done

          # All fallbacks exhausted — keep primary output and its exit code
          echo "[argus] ✗ All fallback models exhausted; keeping primary output"
          echo "$primary_output"
          return $primary_exit_code
        }

        # Resolve fallback queue: explicit input wins, otherwise read from the
        # auto-refreshed config/free-models.yml (updated every 12h by the
        # update-free-models workflow), falling back to last-known-good defaults.
        FALLBACK_MODELS="${{ inputs.fallback-models }}"
        if [ -z "$FALLBACK_MODELS" ]; then
          MODELS_FILE="${{ github.action_path }}/../../../config/free-models.yml"
          if [ -f "$MODELS_FILE" ]; then
            FALLBACK_MODELS=$(grep -E '^fallback_models:' "$MODELS_FILE" | head -1 | cut -d: -f2- | xargs)
          fi
        fi
        if [ -z "$FALLBACK_MODELS" ]; then
          echo "[argus] ⚠ No fallback models configured; using last-known-good defaults"
          FALLBACK_MODELS="opencode/hy3-free,opencode/nemotron-3-ultra-free,opencode/laguna-s-2.1-free,opencode/nemotron-3.5-lightning-free,opencode/mimo-v2.5-free"
        fi
        echo "[argus] Fallback queue: $FALLBACK_MODELS"

        run_with_fallback_queue "${{ inputs.model }}" "$FALLBACK_MODELS"
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        USE_GITHUB_TOKEN: "true"
        PROMPT: ${{ env.PROMPT }}

    - name: Run fixture regression tests
      if: inputs.fixture-mode == 'true'
      run: |
        python3 ${{ github.action_path }}/../../../tools/run_fixture_tests.py \
          --model "${{ inputs.model }}" \
          $([ -n "${{ inputs.fallback-models }}" ] && echo --fallback-models "${{ inputs.fallback-models }}") \
          --json fixture-results.json
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
