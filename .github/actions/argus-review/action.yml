name: Argus Review
description: >
  Frontend design code review via OpenCode, powered by Argus project rules.
  Supports consumer-side .argus.yml configuration for per-repo customization.

inputs:
  github-token:
    description: argus-flash GitHub App installation token
    required: true
  api-key:
    description: >
      OpenCode Zen API key for the LLM provider (optional). When empty,
      falls back to the GitHub App's configured environment. Get a free key
      at https://opencode.ai/auth
    default: ""
  model:
    description: >
      LLM model to use (primary; falls back to fallback queue on error).
      When empty, resolved at runtime from config/free-models.yml primary
      (auto-refreshed every 12 hours), with a last-known-good built-in
      default if the config is missing.
    default: ""
  fallback-models:
    description: >
      Optional comma-separated fallback model queue override. When empty
      (default), the queue is read from config/free-models.yml in this repo,
      which is auto-refreshed every 12 hours from the live opencode model
      list. Set this input to pin an explicit queue for a consumer repo.
    default: ""
  config-path:
    description: >
      Path to the consumer repository's .argus.yml config file, relative to
      the consumer repo root. Defaults to .argus.yml (repo root).
    default: .argus.yml
  fixture-mode:
    description: >
      When set to "true", run Argus against the fixture files in
      tests/fixtures/ for regression validation instead of reviewing a PR.
      Intended for use in the Argus repo's own CI only.
    default: "false"

runs:
  using: composite
  steps:
    - name: Validate inputs (fail-fast on missing github-token)
      # Closes #104 — consumers often pass GitHub App credentials
      # (app-id / private-key) instead of an installation token. GitHub
      # Actions only warns about unknown inputs and continues, leaving
      # github-token empty; the downstream `opencode github run` then
      # fails with a confusing error pointing at the GITHUB_TOKEN env
      # variable. This step catches the misconfiguration at the boundary
      # and fails fast with an actionable message.
      shell: bash
      env:
        TOKEN: ${{ inputs.github-token }}
      run: |
        if [ -z "$TOKEN" ]; then
          echo "::error::github-token input is empty or not provided."
          echo "::error::This action expects an argus-flash GitHub App installation token as 'github-token'."
          echo "::error::Common mistake: passing GitHub App credentials 'app-id'/'private-key' in the 'with:' block. GitHub Actions only warns about unknown inputs, so github-token stays empty and 'opencode github run' later fails with a misleading error about GITHUB_TOKEN."
          echo "::error::Fix: use actions/create-github-app-token to mint an installation token, then pass it as github-token."
          echo "::error::Reference: .github/workflows/review.yml in this repo (steps 'Generate argus-flash token' + 'cgartlab/argus/.github/actions/argus-review')."
          exit 1
        fi
    - name: Configure git
      run: |
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        # The token-bearing remote below is required only for opencode CLI to
        # push the review; the token is scrubbed from .git/config by the
        # "Scrub token from git config" step (always runs) after the review.
        git remote set-url origin https://x-access-token:${{ inputs.github-token }}@github.com/${{ github.repository }}.git
      shell: bash

    - name: Install OpenCode CLI
      run: curl -fsSL https://opencode.ai/install | bash
      shell: bash

    - name: Load consumer configuration (.argus.yml)
      id: load-config
      run: |
        CONFIG_PATH="${{ inputs.config-path }}"

        # If the consumer has a .argus.yml, validate and emit env vars.
        # If not present, load_config.py will silently use defaults.
        python3 ${{ github.action_path }}/../../../tools/load_config.py \
          --config "$CONFIG_PATH" \
          --output-env

        # Surface which config source was used for debug visibility
        if [ -f "$CONFIG_PATH" ]; then
          echo "ARGUS_CONFIG_SOURCE=$CONFIG_PATH" >> $GITHUB_ENV
          echo "[argus] Loaded consumer config from $CONFIG_PATH"
        else
          echo "ARGUS_CONFIG_SOURCE=defaults" >> $GITHUB_ENV
          echo "[argus] No $CONFIG_PATH found — using built-in defaults"
        fi
      shell: bash

    - name: Detect design system
      id: detect-system
      run: |
        # Explicit .argus.yml wins; otherwise parse package.json precisely.
        DESIGN_SYSTEM="${ARGUS_DESIGN_SYSTEM:-auto}"
        if [ "$DESIGN_SYSTEM" = "auto" ] && [ -f package.json ]; then
          DESIGN_SYSTEM=$(python3 - <<'PY'
        import json, sys
        try:
            data = json.load(open("package.json", encoding="utf-8"))
        except Exception:
            sys.exit(0)  # no/invalid package.json -> default custom
        deps = {}
        deps.update(data.get("dependencies", {}))
        deps.update(data.get("devDependencies", {}))
        if "antd" in deps:
            major = deps["antd"].lstrip("^~").split(".")[0]
            try:
                print("antd5" if int(major) >= 5 else "antd4-unsupported")
            except ValueError:
                print("antd5")
        elif "@mui/material" in deps:
            print("material3")
        elif "@shopify/polaris" in deps:
            print("polaris")
        else:
            print("custom")
        PY
        )
        fi
        echo "ARGUS_DESIGN_SYSTEM=${DESIGN_SYSTEM:-custom}" >> $GITHUB_ENV
        echo "[argus] Detected design system: ${DESIGN_SYSTEM:-custom}"
      shell: bash

    - name: Build review prompt from Argus rules
      id: prompt
      run: |
        {
          echo "PROMPT<<EOF"
          echo "You are Argus, a frontend design code review agent."
          echo ""
          echo "## Argus Hard Rules"
          cat ${{ github.action_path }}/../../../AGENTS.md
          echo ""

          # Inject design token mapping if a known system is detected
          TOKEN_FILE="${{ github.action_path }}/../../../.github/tokens/$ARGUS_DESIGN_SYSTEM.json"
          if [ "$ARGUS_DESIGN_SYSTEM" = "antd4-unsupported" ]; then
            echo "## Design System: antd v4 (unsupported)"
            echo "antd v4 uses Less variables, not CSS custom properties."
            echo "Configure design-system: custom in .argus.yml, or migrate to antd v5."
            echo ""
          elif [ -n "$ARGUS_DESIGN_SYSTEM" ] && [ "$ARGUS_DESIGN_SYSTEM" != "custom" ] && [ -f "$TOKEN_FILE" ]; then
            echo "## Design System: $ARGUS_DESIGN_SYSTEM"
            echo "Reference these design tokens when suggesting fixes:"
            cat "$TOKEN_FILE"
            echo ""
          elif [ "$ARGUS_DESIGN_SYSTEM" = "custom" ] || [ -z "$ARGUS_DESIGN_SYSTEM" ]; then
            echo "## Custom Design System"
            echo "No known design-token system detected. Treat any \`var(--<any-name>)\` as a valid design token reference."
            echo ""
          fi

          echo "## Review Dimensions"
          cat ${{ github.action_path }}/../../../SKILL.md
          echo ""

          # Inject consumer configuration context if present
          if [ -n "$ARGUS_TOKEN_PREFIX" ] && [ "$ARGUS_TOKEN_PREFIX" != "--ds-" ]; then
            echo "## Consumer Configuration"
            echo "Design token prefix for this repository: \`$ARGUS_TOKEN_PREFIX\`"
            echo "Treat any \`var($ARGUS_TOKEN_PREFIX*)\` as a valid design token reference."
            echo ""
          fi

          if [ -n "$ARGUS_IGNORE_RULES" ]; then
            echo "## Disabled Rules (per .argus.yml)"
            echo "The following rule IDs are disabled for this repository: $ARGUS_IGNORE_RULES"
            echo "Do NOT report findings for these rules."
            echo ""
          fi

          if [ -n "$ARGUS_IGNORE_PATHS" ]; then
            echo "## Ignored Paths (per .argus.yml)"
            echo "Skip any files matching these patterns:"
            echo "$ARGUS_IGNORE_PATHS"
            echo ""
          fi

          echo "## Failure Threshold"
          echo "Block-level severities for this repository: ${ARGUS_FAIL_ON:-P0,P1}"
          echo ""
          echo "Review ALL frontend code in this PR."
          echo "Group output by severity: P0 (blocking) -> P1 (high) -> P2 (medium) -> P3 (polish)."
          echo "For every issue show: Found vs Expected, and name the exact design token."
          echo "Cap total findings to ${ARGUS_MAX_FINDINGS:-50} (report highest severity first)."
          echo "EOF"
        } >> $GITHUB_ENV
      shell: bash

    - name: Run OpenCode review (with fallback queue)
      if: inputs.fixture-mode == 'false'
      shell: bash
      run: |
        # Auth: only export when the consumer supplied a key — never override
        # an existing environment value (e.g. the GitHub App's configured key).
        if [ -n "${{ inputs.api-key }}" ]; then
          export OPENCODE_API_KEY="${{ inputs.api-key }}"
        fi
        if [ -n "$OPENCODE_API_KEY" ]; then
          echo "[argus] OpenCode API key: configured"
        else
          echo "[argus] OpenCode API key: unset"
        fi

        # Resolve primary model: explicit input wins; otherwise read from the
        # auto-refreshed config/free-models.yml (refreshed weekly by the
        # update-free-models workflow); last resort is a last-known-good default.
        PRIMARY_MODEL="${{ inputs.model }}"
        if [ -z "$PRIMARY_MODEL" ]; then
          MODELS_FILE="${{ github.action_path }}/../../../config/free-models.yml"
          if [ -f "$MODELS_FILE" ]; then
            PRIMARY_MODEL=$(grep -E '^primary:' "$MODELS_FILE" | head -1 | cut -d: -f2- | xargs)
          fi
        fi
        if [ -z "$PRIMARY_MODEL" ]; then
          echo "[argus] ⚠ No primary model configured; using last-known-good default"
          PRIMARY_MODEL="opencode/nemotron-3-ultra-free"
        fi

        run_with_fallback_queue() {
          local primary_model="$1"
          local fallback_models="$2"
          local exit_code=0
          local primary_output=""
          local primary_exit_code=0

          # Shared regexes:
          #   retry_re — rate-limit OR model-unavailable (fallback queue helps)
          #   auth_re  — missing/invalid API key (every zen model shares the
          #              same key, so the fallback queue fails identically;
          #              fail fast with guidance instead of pointless retries)
          local retry_re="429[[:space:]]+(rate|too|exceeded|limit(ed|s)?)[[:space:]]|rate[[:space:]]*limit|too many requests|model[[:space:]]+not[[:space:]]+found|no[[:space:]]+such[[:space:]]+model|model[[:space:]]+does[[:space:]]+not[[:space:]]+exist|upstream request failed|endpoint is unavailable"
          local auth_re="401[[:space:]]+(unauthorized|invalid)|403[[:space:]]+(forbidden|invalid)|unauthorized|authentication[[:space:]]+(failed|error)|invalid[[:space:]]+api[[:space:]]+key|missing[[:space:]]+api[[:space:]]+key"

          print_auth_guidance() {
            # Build the guidance text with the GitHub-expression literal
            # (lbrace + rbrace tokens) split so the runner does not try to
            # evaluate it as an expression here.
            # printf keeps every line as a single YAML-safe argument (block
            # scalars cannot contain dedented continuation lines).
            # NOTE: We must never write the GitHub-expression delimiter
            # (dollar + two left braces / two right braces) literally
            # inside this `run` block — the Actions template parser would
            # treat it as an expression and fail. Instead we assemble the
            # braces via shell variable expansion, which the template
            # layer ignores.
            local dollar='$'
            local lbrace="${dollar}{{"
            local rbrace="}}"
            local guidance
            guidance="$(printf '%s\n' \
              '[argus] 🚨 No usable OpenCode Zen API key detected.' \
              'The primary model and all fallbacks require an OpenCode Zen API key.' \
              '' \
              'How to fix (2 minutes):' \
              '  Step 1: Register a free account at https://opencode.ai' \
              '  Step 2: Create an API key at https://opencode.ai/auth' \
              '  Step 3: Add it to this repo: Settings → Secrets and variables → Actions →' \
              '          New repository secret → name `OPENCODE_API_KEY`, paste your key' \
              '  Step 4: Your workflow passes it via' \
              "          \`api-key: ${lbrace} secrets.OPENCODE_API_KEY ${rbrace}\` (default template)." \
              '  Step 5: Re-run this workflow.' \
              '' \
              'Alternatively configure your own LLM provider key if supported.')"
            echo "$guidance"
            # Best-effort: post the same guidance as a PR comment (never blocks).
            local pr_number="${{ github.event.pull_request.number }}"
            if [ -n "$pr_number" ]; then
              gh api repos/${{ github.repository }}/issues/${pr_number}/comments \
                -X POST --field body="$guidance" >/dev/null 2>&1 || true
            fi
          }

          echo "[argus] Using model: $primary_model"
          export MODEL="$primary_model"

          # Try primary model
          primary_output=$(opencode github run 2>&1) || primary_exit_code=$?

          if [ $primary_exit_code -eq 0 ]; then
            echo "$primary_output"
            echo "[argus] ✓ Review completed with model: $primary_model"
            return 0
          fi

          # Auth failure — fail fast with guidance (all zen models share the
          # same key, so retrying the fallback queue would produce the same 401s).
          if echo "$primary_output" | grep -qiE "$auth_re"; then
            echo "$primary_output" | tail -5
            print_auth_guidance
            return $primary_exit_code
          fi

          # Check if retryable (rate-limited / model unavailable)
          if ! echo "$primary_output" | grep -qiE "$retry_re"; then
            # Not a retryable condition — fail as-is
            echo "$primary_output"
            return $primary_exit_code
          fi

          echo "[argus] ⚠ Primary model '$primary_model' retryable (rate-limited or unavailable)"
          echo "$primary_output"

          # Dismiss any pending or stale review the primary model may have
          # posted before failing, so the fallback doesn't create a duplicate
          # conflicting review on the same PR.
          dismiss_stale_reviews() {
            local pr_number="${{ github.event.pull_request.number }}"
            [ -z "$pr_number" ] && return 0
            echo "[argus] Dismissing stale/pending reviews from failed primary run..."
            reviews=$(gh api repos/${{ github.repository }}/pulls/${pr_number}/reviews \
                        --jq '.[] | select(.state == "PENDING" or .state == "COMMENTED") | .id' 2>/dev/null || true)
            for rid in $reviews; do
              gh api repos/${{ github.repository }}/pulls/${pr_number}/reviews/${rid}/dismissals \
                -X PUT -f event=DISMISS \
                -f message="Dismissed incomplete review before fallback retry" 2>/dev/null \
                && echo "[argus]   Dismissed review #${rid}" \
                || true
            done
          }
          dismiss_stale_reviews

          # Iterate through fallback queue.
          # Each `opencode github run` may post a PR review comment. Stale
          # reviews from the failed primary run have been dismissed above.
          local output=""
          IFS=',' read -ra queue <<< "$fallback_models"
          for fb_model in "${queue[@]}"; do
            fb_model=$(echo "$fb_model" | xargs)  # trim whitespace
            [ -z "$fb_model" ] && continue
            echo "[argus] → Trying fallback: $fb_model"
            export MODEL="$fb_model"
            exit_code=0
            output=$(opencode github run 2>&1) || exit_code=$?
            if [ $exit_code -eq 0 ]; then
              echo "$output"
              echo "[argus] ✓ Review completed with fallback model: $fb_model"
              return 0
            fi
            # Auth failure — same key issue, stop trying and guide the user.
            if echo "$output" | grep -qiE "$auth_re"; then
              echo "[argus] ⚠ Fallback '$fb_model' failed (auth): all zen models require the same API key"
              dismiss_stale_reviews
              print_auth_guidance
              return $exit_code
            fi
            if echo "$output" | grep -qiE "$retry_re"; then
              echo "[argus] ⚠ Fallback '$fb_model' rate-limited or unavailable, trying next..."
            else
              # Non-retryable — log diagnostic tail but continue trying next model.
              # Previously this caused the review to abort (return $exit_code).
              echo "[argus] ⚠ Fallback '$fb_model' failed (non-retryable):"
              echo "$output" | tail -5
            fi
            # This failed fallback may have posted a PENDING/COMMENTED review —
            # clear it before trying the next model to avoid duplicate comments.
            dismiss_stale_reviews
          done

          # All fallbacks exhausted — keep primary output and its exit code
          echo "[argus] ✗ All fallback models exhausted; keeping primary output"
          if [ -z "$primary_output" ]; then
            echo "[argus] ✗ Primary model produced no output (exit code: $primary_exit_code). No review was generated."
            echo "[argus]   Possible causes: timeout killed the process, network issue, or model hang."
            echo "[argus]   Action failed without a review comment — check the step log for the underlying error."
          else
            echo "$primary_output"
          fi
          return $primary_exit_code
        }

        # Resolve fallback queue: explicit input wins, otherwise read from the
        # auto-refreshed config/free-models.yml (updated every 12h by the
        # update-free-models workflow). Missing config is a hard error — this
        # repo must commit config/free-models.yml.
        FALLBACK_MODELS="${{ inputs.fallback-models }}"
        if [ -z "$FALLBACK_MODELS" ]; then
          MODELS_FILE="${{ github.action_path }}/../../../config/free-models.yml"
          if [ -f "$MODELS_FILE" ]; then
            FALLBACK_MODELS=$(grep -E '^fallback_models:' "$MODELS_FILE" | head -1 | cut -d: -f2- | xargs)
          fi
        fi
        if [ -z "$FALLBACK_MODELS" ]; then
          echo "[argus] ✗ No fallback models configured and config/free-models.yml is missing — cannot run review"
          echo "[argus]   This repository must contain config/free-models.yml (committed by tools/update_free_models.py)."
          exit 1
        fi
        echo "[argus] Fallback queue: $FALLBACK_MODELS"

        run_with_fallback_queue "$PRIMARY_MODEL" "$FALLBACK_MODELS"
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        USE_GITHUB_TOKEN: "true"
        PROMPT: ${{ env.PROMPT }}
        OPENCODE_API_KEY: ${{ inputs.api-key }}

    - name: Scrub token from git config
      if: always()
      run: git remote set-url origin https://github.com/${{ github.repository }}.git
      shell: bash

    - name: Run fixture regression tests
      if: inputs.fixture-mode == 'true'
      run: |
        python3 ${{ github.action_path }}/../../../tools/run_fixture_tests.py \
          $([ -n "${{ inputs.model }}" ] && echo --model "${{ inputs.model }}") \
          $([ -n "${{ inputs.fallback-models }}" ] && echo --fallback-models "${{ inputs.fallback-models }}") \
          --json fixture-results.json
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}