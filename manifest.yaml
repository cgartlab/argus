name: argus
# Note: also registered as `argus-design-review` (see SKILL.md frontmatter) so the
# skill loader can find this agent by name.
version: 0.4.1
description: Frontend design code review agent — validates correctness, accessibility, security, and design token usage.
# No standalone `accessibility` skill is shipped — a11y rules are built into the
# SKILL.md Review Dimensions.
preferred_models:
  - opencode/deepseek-v4-flash-free
required_capabilities:
  - code_review
  - lint
  - type_check
optional_capabilities:
  - men-integration   # can be invoked by the cgartlab/men team; standalone runs are unaffected
constraints:
  never_approve_unseen: true
  report_all_p0_p1: true
inputs:
  - name: prompt
    type: string
    description: The task or artifact to validate
  - name: check
    type: string
    description: Specific check type (correctness, security, logic, accessibility)
outputs:
  - name: result
    type: string
    description: Pass or fail
  - name: checks
    type: array
    description: Individual check results
  - name: issues
    type: array
    description: Issues found (if any)
